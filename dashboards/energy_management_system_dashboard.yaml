title: Energy Management System
views:
  - title: Overzicht
    path: overzicht
    type: sections
    sections:


      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: >-
              {% set p = state_attr('sensor.woonkamer_energy_management_system_system_status', 'aandachtspunten') or [] %}{{ '✅ Geen aandachtspunten' if p | length == 0 else '⚠️ ' ~ p | length ~ ' aandachtspunt(en)' }}
            secondary: >-
              {% set p = state_attr('sensor.woonkamer_energy_management_system_system_status', 'aandachtspunten') or [] %}{{ 'Alles in orde.' if p | length == 0 else (p[0].split('.')[0] ~ '. Tik voor alle details.') }}
            multiline_secondary: true
            icon: >-
              {% set p = state_attr('sensor.woonkamer_energy_management_system_system_status', 'aandachtspunten') or [] %}{{ 'mdi:check-circle-outline' if p | length == 0 else 'mdi:alert-outline' }}
            icon_color: >-
              {% set p = state_attr('sensor.woonkamer_energy_management_system_system_status', 'aandachtspunten') or [] %}{{ 'green' if p | length == 0 else 'orange' }}
            entity: sensor.woonkamer_energy_management_system_system_status
            tap_action:
              action: navigate
              navigation_path: /energy-management-system/details
            grid_options:
              columns: 12
              rows: auto
          - type: markdown
            content: >-
              {% set p = state_attr('sensor.woonkamer_energy_management_system_system_status', 'aandachtspunten') or [] %}{% set i = state_attr('sensor.woonkamer_energy_management_system_system_status', 'informatief') or [] %}{% if p | length == 0 and i | length == 0 %}✅ Geen aandachtspunten.{% else %}{% for punt in p %}⚠️ {{ punt }}

              {% endfor %}{% for punt in i %}ℹ️ {{ punt }}

              {% endfor %}{% endif %}
            grid_options:
              columns: 12
              rows: auto

          - type: heading
            heading: Accu, rendement & live cijfers
            grid_options:
              columns: 12
              rows: 1
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.solarflow_2400_ac_electric_level') }}%"
            secondary: Accu SoC
            icon: mdi:battery-charging-medium
            icon_color: >-
              {% set v = states('sensor.solarflow_2400_ac_electric_level') | float(0) %}
              {% if v >= 40 %}green{% elif v >= 20 %}yellow{% else %}red{% endif %}
            entity: sensor.solarflow_2400_ac_electric_level
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            primary: >-
              {{ states('sensor.woonkamer_energy_management_system_learned_battery_efficiency') }}%
            secondary: Geleerd rendement
            icon: mdi:battery-sync-outline
            icon_color: >-
              {% set v = states('sensor.woonkamer_energy_management_system_learned_battery_efficiency') | float(0) %}
              {% if v >= 75 %}green{% elif v >= 60 %}yellow{% else %}red{% endif %}
            entity: sensor.woonkamer_energy_management_system_learned_battery_efficiency
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: more-info
          - type: markdown
            content: >
              {%- set history =
              state_attr('sensor.woonkamer_energy_management_system_learned_battery_efficiency',
              'history') or [] %}

              {%- if history|length >= 2 %}

              {%- set laatste = history[-1] %}

              {%- set vorige = history[-2] %}

              {%- set verschil = laatste - vorige %}

              Laatste laadcyclus {{ '%.1f'|format(laatste) }}%, daarvoor
              {{ '%.1f'|format(vorige) }}% ({{ '%+.1f'|format(verschil) }} procentpunt).
              De tegel hierboven toont de mediaan over
              {{ history|length }} cycli - één afwijkende cyclus telt daar
              bewust nauwelijks in mee.

              {%- else %}

              Nog niet genoeg metingen voor een trend

              {%- endif %}
            grid_options:
              columns: 12
              rows: 1
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.solarflow_2400_ac_available_kwh') }} kWh"
            secondary: Beschikbare energie
            icon: mdi:battery-high
            icon_color: green
            entity: sensor.solarflow_2400_ac_available_kwh
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.hw_p1_vermogen') }} W"
            secondary: Netstroom (P1)
            icon: mdi:transmission-tower
            icon_color: orange
            entity: sensor.hw_p1_vermogen
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            primary: >-
              {{ states('sensor.woonkamer_energy_management_system_huishoudverbruik_werkelijk') }} W
            secondary: Huishoudverbruik
            icon: mdi:home-lightning-bolt-outline
            icon_color: amber
            entity: sensor.woonkamer_energy_management_system_huishoudverbruik_werkelijk
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            primary: >-
              {{
              states('sensor.woonkamer_energy_management_system_current_price_used_by_integration')
              }} €/kWh
            secondary: Huidige prijs
            icon: mdi:cash-sync
            icon_color: blue
            entity: >-
              sensor.woonkamer_energy_management_system_current_price_used_by_integration
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            primary: >-
              {% set s = 'sensor.woonkamer_energy_management_system_accu_koeling' %}{% set accu = state_attr(s, 'accu_c') %}{{ (accu ~ ' °C') if accu is not none else states(s) }}
            secondary: >-
              {% set s = 'sensor.woonkamer_energy_management_system_accu_koeling' %}{% set st = states(s) %}Accu-koeling: {{ st }}
            icon: mdi:fan
            icon_color: >-
              {% set st = states('sensor.woonkamer_energy_management_system_accu_koeling') %}{% if st == 'koelt' %}blue{% elif st == 'uit' %}grey{% else %}orange{% endif %}
            entity: sensor.woonkamer_energy_management_system_accu_koeling
            tap_action:
              action: more-info
            grid_options:
              columns: 6
              rows: 1

      - type: grid
        cards:
          - type: heading
            heading: Modus & besluit
            grid_options:
              columns: 12
              rows: 1
          - type: custom:mushroom-template-card
            primary: "{{ states('select.zendure_manager_operation') }}"
            secondary: Werkelijke modus
            icon: mdi:battery-sync
            icon_color: cyan
            entity: select.zendure_manager_operation
            tap_action:
              action: none
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-template-card
            primary: >-
              {{
              states('sensor.energy_management_system_expected_operation_mode')
              }}
            secondary: Verwachte modus
            icon: mdi:brain
            icon_color: purple
            entity: sensor.energy_management_system_expected_operation_mode
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            primary: >-
              {{
              states('sensor.energy_management_system_effective_expensive_quarters')
              }} kwartieren
            secondary: Boven prijsdrempel
            icon: mdi:chart-bell-curve
            icon_color: red
            entity: sensor.energy_management_system_effective_expensive_quarters
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            primary: "{{ states('number.solaredge_i1_active_power_limit') }}%"
            secondary: PV-limiet
            icon: mdi:solar-power-variant
            icon_color: amber
            entity: number.solaredge_i1_active_power_limit
            tap_action:
              action: none
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-template-card
            primary: >-
              {% set source = state_attr('sensor.woonkamer_energy_management_system_explanation', 'heavy_load_source') %}
              {{ {'vaatwasser': 'Vaatwasser', 'wasmachine': 'Wasmachine', 'quooker': 'Quooker', 'airco': 'Airco', 'oven': 'Oven', 'kookplaat': 'Kookplaat'}.get(source, 'Geen') }}
            secondary: Grootverbruiker actief
            icon: >-
              {{ 'mdi:lightning-bolt' if
              state_attr('sensor.woonkamer_energy_management_system_explanation', 'heavy_load_source')
              else 'mdi:lightning-bolt-outline' }}
            icon_color: >-
              {{ 'orange' if
              state_attr('sensor.woonkamer_energy_management_system_explanation', 'heavy_load_source')
              else 'grey' }}
            entity: sensor.woonkamer_energy_management_system_explanation
            tap_action:
              action: none
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 1

      - type: grid
        cards:
          - type: heading
            heading: Besturing
            grid_options:
              columns: 12
              rows: 1
          - type: custom:mushroom-entity-card
            entity: switch.energy_management_system_force_manual
            name: Force manual
            icon: mdi:hand-back-right
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-entity-card
            entity: switch.energy_management_system_learning_only_no_control
            name: Learning only
            icon: mdi:school-outline
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-entity-card
            entity: switch.woonkamer_energy_management_system_vacation_mode
            name: Vakantiemodus
            icon: mdi:bag-suitcase-outline
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-entity-card
            entity: button.woonkamer_energy_management_system_test_notificatie_versturen
            name: Testmelding
            icon: mdi:bell-ring-outline
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-entity-card
            entity: switch.woonkamer_energy_management_system_steelstofzuiger_overrule
            name: Steelstofzuiger
            icon: mdi:hand-back-right-outline
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-entity-card
            entity: switch.woonkamer_energy_management_system_fietsladers_overrule
            name: Fietsladers
            icon: mdi:hand-back-right-outline
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-entity-card
            entity: switch.woonkamer_energy_management_system_vaatwasser_wasmachine_meldingen
            name: Apparaatmeldingen
            icon: mdi:bell-outline
            grid_options:
              columns: 6
              rows: 1

      - type: grid
        cards:
          - type: heading
            heading: Status per onderwerp
            grid_options:
              columns: 12
              rows: 1
          - type: custom:mushroom-template-card
            primary: Accumodules
            secondary: >-
              {% set s = (state_attr('sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling', 'samenvattingen') or {}).get('accumodules') or {} %}{{ s.get('zin', 'Nog geen gegevens.') }}
            multiline_secondary: true
            icon: mdi:battery-heart-variant
            icon_color: >-
              {% set n = ((state_attr('sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling', 'samenvattingen') or {}).get('accumodules') or {}).get('niveau') %}{{ 'red' if n == 'onbetrouwbaar' else ('green' if n == 'betrouwbaar' else 'orange') }}
            entity: sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling
            tap_action:
              action: navigate
              navigation_path: /energy-management-system/details
            grid_options:
              columns: 6
              rows: auto
          - type: custom:mushroom-template-card
            primary: Apparaten
            secondary: >-
              {% set s = (state_attr('sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling', 'samenvattingen') or {}).get('apparaten') or {} %}{{ s.get('zin', 'Nog geen gegevens.') }}
            multiline_secondary: true
            icon: mdi:power-plug
            icon_color: >-
              {% set n = ((state_attr('sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling', 'samenvattingen') or {}).get('apparaten') or {}).get('niveau') %}{{ 'red' if n == 'onbetrouwbaar' else ('green' if n == 'betrouwbaar' else 'orange') }}
            entity: sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling
            tap_action:
              action: navigate
              navigation_path: /energy-management-system/details
            grid_options:
              columns: 6
              rows: auto
          - type: custom:mushroom-template-card
            primary: Zelflerend
            secondary: >-
              {% set s = (state_attr('sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling', 'samenvattingen') or {}).get('zelflerend') or {} %}{{ s.get('zin', 'Nog geen gegevens.') }}
            multiline_secondary: true
            icon: mdi:school-outline
            icon_color: >-
              {% set n = ((state_attr('sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling', 'samenvattingen') or {}).get('zelflerend') or {}).get('niveau') %}{{ 'red' if n == 'onbetrouwbaar' else ('green' if n == 'betrouwbaar' else 'orange') }}
            entity: sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling
            tap_action:
              action: navigate
              navigation_path: /energy-management-system/details
            grid_options:
              columns: 6
              rows: auto
          - type: custom:mushroom-template-card
            primary: Financieel
            secondary: >-
              {% set s = (state_attr('sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling', 'samenvattingen') or {}).get('financieel') or {} %}{{ s.get('zin', 'Nog geen gegevens.') }}
            multiline_secondary: true
            icon: mdi:cash-multiple
            icon_color: >-
              {% set n = ((state_attr('sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling', 'samenvattingen') or {}).get('financieel') or {}).get('niveau') %}{{ 'red' if n == 'onbetrouwbaar' else ('green' if n == 'betrouwbaar' else 'orange') }}
            entity: sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling
            tap_action:
              action: navigate
              navigation_path: /energy-management-system/details
            grid_options:
              columns: 6
              rows: auto
          - type: custom:mushroom-template-card
            primary: Klimaat
            secondary: >-
              {% set s = (state_attr('sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling', 'samenvattingen') or {}).get('klimaat') or {} %}{{ s.get('zin', 'Nog geen gegevens.') }}
            multiline_secondary: true
            icon: mdi:home-thermometer
            icon_color: >-
              {% set n = ((state_attr('sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling', 'samenvattingen') or {}).get('klimaat') or {}).get('niveau') %}{{ 'red' if n == 'onbetrouwbaar' else ('green' if n == 'betrouwbaar' else 'orange') }}
            entity: sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling
            tap_action:
              action: navigate
              navigation_path: /energy-management-system/details
            grid_options:
              columns: 6
              rows: auto
          - type: custom:mushroom-template-card
            primary: Water
            secondary: >-
              {% set s = (state_attr('sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling', 'samenvattingen') or {}).get('water') or {} %}{{ s.get('zin', 'Nog geen gegevens.') }}
            multiline_secondary: true
            icon: mdi:water
            icon_color: >-
              {% set n = ((state_attr('sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling', 'samenvattingen') or {}).get('water') or {}).get('niveau') %}{{ 'red' if n == 'onbetrouwbaar' else ('green' if n == 'betrouwbaar' else 'orange') }}
            entity: sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling
            tap_action:
              action: navigate
              navigation_path: /energy-management-system/details
            grid_options:
              columns: 6
              rows: auto
          - type: custom:mushroom-template-card
            primary: Meetkwaliteit
            secondary: >-
              {% set s = (state_attr('sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling', 'samenvattingen') or {}).get('kwaliteit') or {} %}{{ s.get('zin', 'Nog geen gegevens.') }}
            multiline_secondary: true
            icon: mdi:shield-check-outline
            icon_color: >-
              {% set n = ((state_attr('sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling', 'samenvattingen') or {}).get('kwaliteit') or {}).get('niveau') %}{{ 'red' if n == 'onbetrouwbaar' else ('green' if n == 'betrouwbaar' else 'orange') }}
            entity: sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling
            tap_action:
              action: navigate
              navigation_path: /energy-management-system/details
            grid_options:
              columns: 6
              rows: auto

      - type: grid
        cards:
          - type: heading
            heading: Meer bekijken
            grid_options:
              columns: 12
              rows: 1
          - type: custom:mushroom-template-card
            primary: Systeem
            secondary: Accu en apparaten
            icon: mdi:home-analytics
            icon_color: blue
            tap_action:
              action: navigate
              navigation_path: /energy-management-system/systeem
            grid_options:
              columns: 6
              rows: auto
          - type: custom:mushroom-template-card
            primary: Financieel
            secondary: Kosten en besparing
            icon: mdi:cash-multiple
            icon_color: blue
            tap_action:
              action: navigate
              navigation_path: /energy-management-system/financieel
            grid_options:
              columns: 6
              rows: auto
          - type: custom:mushroom-template-card
            primary: Verloop
            secondary: Wat er gebeurde
            icon: mdi:chart-timeline-variant
            icon_color: blue
            tap_action:
              action: navigate
              navigation_path: /energy-management-system/verloop
            grid_options:
              columns: 6
              rows: auto
          - type: custom:mushroom-template-card
            primary: Kwaliteit
            secondary: Betrouwbaarheid
            icon: mdi:shield-check-outline
            icon_color: blue
            tap_action:
              action: navigate
              navigation_path: /energy-management-system/kwaliteit
            grid_options:
              columns: 6
              rows: auto
          - type: custom:mushroom-template-card
            primary: Meldingen
            secondary: Aan/uit en historie
            icon: mdi:bell-outline
            icon_color: blue
            tap_action:
              action: navigate
              navigation_path: /energy-management-system/meldingen
            grid_options:
              columns: 6
              rows: auto
          - type: custom:mushroom-template-card
            primary: Visueel
            secondary: Plattegrond
            icon: mdi:floor-plan
            icon_color: blue
            tap_action:
              action: navigate
              navigation_path: /energy-management-system/visueel
            grid_options:
              columns: 6
              rows: auto

  - title: Visueel
    path: visueel
    subview: true
    # panel: true laat deze ene kaart de volledige breedte en hoogte
    # vullen - precies waar een panel-view voor bedoeld is en de enige
    # manier om de tekening op een groot scherm echt tot zijn recht te
    # laten komen. Een panel-view mag exact één kaart bevatten.
    panel: true
    cards:
      - type: picture-elements
        # v0.63.131: de ?v= is GEEN opsmuk maar noodzakelijk.
        # /local/ serveert een statisch bestand onder een vaste naam,
        # dus browsers (en de HA-app) blijven de oude tekening tonen
        # terwijl de waarden er live overheen komen - gerapporteerd als
        # "richtingen van de stromen nog niet geupdate?". De
        # versiesleutel dwingt een verse ophaal af. Een test bewaakt
        # dat deze waarde gelijk blijft aan de versie in manifest.json.
        image: /local/energy_management_system_overview.svg?v=1.16.3
        elements:
          - type: state-label
            entity: sensor.woonkamer_energy_management_system_system_status
            tap_action:
              action: more-info
            style:
              top: 10.33%
              left: 4.38%
              transform: translate(0, -50%)
              font-size: 34px
              font-weight: 700
              color: '#ffffff'
              white-space: nowrap
              pointer-events: auto
              text-shadow: 0 1px 3px rgba(0,0,0,0.85)
          - type: state-label
            entity: sensor.solaredge_i1_ac_power
            tap_action:
              action: more-info
            style:
              top: 29.56%
              left: 15.0%
              transform: translate(0, -50%)
              font-size: 32px
              font-weight: 600
              color: '#f9d423'
              white-space: nowrap
              pointer-events: auto
              text-shadow: 0 1px 3px rgba(0,0,0,0.85)
          - type: state-label
            entity: sensor.woonkamer_energy_management_system_weather_ensemble_bewolkingsgraad
            tap_action:
              action: more-info
            style:
              top: 36.89%
              left: 15.0%
              transform: translate(0, -50%)
              font-size: 24px
              font-weight: 600
              color: '#c8d4e0'
              white-space: nowrap
              pointer-events: auto
              text-shadow: 0 1px 3px rgba(0,0,0,0.85)
          - type: state-label
            entity: sensor.solcast_pv_forecast_resterende_voorspelling_vandaag
            tap_action:
              action: more-info
            style:
              top: 48.89%
              left: 4.38%
              transform: translate(0, -50%)
              font-size: 26px
              font-weight: 600
              color: '#f0c040'
              white-space: nowrap
              pointer-events: auto
              text-shadow: 0 1px 3px rgba(0,0,0,0.85)
          - type: state-label
            entity: sensor.woonkamer_energy_management_system_huishoudverbruik_werkelijk
            tap_action:
              action: more-info
            style:
              top: 35.11%
              left: 33.12%
              transform: translate(0, -50%)
              font-size: 34px
              font-weight: 600
              color: '#ffffff'
              white-space: nowrap
              pointer-events: auto
              text-shadow: 0 1px 3px rgba(0,0,0,0.85)
          - type: state-label
            entity: sensor.woonkamer_energy_management_system_explanation
            attribute: grootste_verbruiker
            tap_action:
              action: more-info
            style:
              top: 34.67%
              left: 57.25%
              transform: translate(0, -50%)
              font-size: 20px
              font-weight: 600
              color: '#c8d4e0'
              white-space: nowrap
              pointer-events: auto
              text-shadow: 0 1px 3px rgba(0,0,0,0.85)
          - type: state-label
            entity: sensor.hw_p1_vermogen
            tap_action:
              action: more-info
            style:
              top: 29.56%
              left: 83.12%
              transform: translate(0, -50%)
              font-size: 32px
              font-weight: 600
              color: '#5dade2'
              white-space: nowrap
              pointer-events: auto
              text-shadow: 0 1px 3px rgba(0,0,0,0.85)
          - type: state-label
            entity: sensor.woonkamer_energy_management_system_explanation
            attribute: current_price_per_kwh
            suffix: ' €/kWh'
            tap_action:
              action: more-info
            style:
              top: 36.89%
              left: 83.12%
              transform: translate(0, -50%)
              font-size: 24px
              font-weight: 600
              color: '#c8d4e0'
              white-space: nowrap
              pointer-events: auto
              text-shadow: 0 1px 3px rgba(0,0,0,0.85)
          - type: state-label
            entity: sensor.woonkamer_energy_management_system_explanation
            attribute: expensive_price_threshold
            suffix: ' €/kWh'
            tap_action:
              action: more-info
            style:
