  - title: Meldingen
    path: meldingen
    cards:
      - type: markdown
        content: |
          Meldingen gaan naar de notify-service die bij Configureren is
          ingesteld. Is die er niet, dan verschijnen ze als melding in
          Home Assistant zelf.


          **Alleen de zes meldingen die er al waren staan standaard aan.**
          Alles wat later is toegevoegd begint uit — twintig meldingen die
          zichzelf aanzetten is een garantie dat je er binnen een week
          niets meer van leest.


          Elke melding heeft een eigen **dempingsvenster**: binnen die tijd
          gaat dezelfde melding niet nog een keer af. Bij modus-wijzigingen
          en sluipverbruik is dat het verschil tussen bruikbaar en
          wegswipen. Tik op een melding om te schakelen, houd vast voor de
          details.

      - type: custom:mushroom-template-card
        primary: >-
          {{ 'Alle meldingen AAN' if is_state('switch.woonkamer_energy_management_system_meldingen_hoofdschakelaar', 'on') else 'Alle meldingen UIT' }}
        secondary: >-
          {% set e = 'switch.woonkamer_energy_management_system_meldingen_hoofdschakelaar' %}Hoofdschakelaar · {{ state_attr(e, 'aantal_ingeschakeld') }} van {{ state_attr(e, 'aantal_soorten') }} soorten ingeschakeld
        icon: mdi:bell-ring-outline
        icon_color: >-
          {{ 'blue' if is_state('switch.woonkamer_energy_management_system_meldingen_hoofdschakelaar', 'on') else 'red' }}
        entity: switch.woonkamer_energy_management_system_meldingen_hoofdschakelaar
        tap_action:
          action: toggle

      - type: custom:mushroom-template-card
        primary: Goedkoop moment voor vaatwasser/wasmachine
        secondary: >-
          {% set e = 'switch.woonkamer_energy_management_system_melding_appliance_cheap_moment' %}{% set last = state_attr(e, 'laatst_verstuurd') %}{{ 'AAN' if is_state(e, 'on') else 'uit' }} · demping 60 min{% if last %} · laatst {{ as_timestamp(last) | timestamp_custom('%-d %b %H:%M') }}{% endif %}
        icon: mdi:bell-outline
        icon_color: >-
          {{ 'green' if is_state('switch.woonkamer_energy_management_system_melding_appliance_cheap_moment', 'on') else 'grey' }}
        entity: switch.woonkamer_energy_management_system_melding_appliance_cheap_moment
        tap_action:
          action: toggle
        hold_action:
          action: more-info

      - type: custom:mushroom-template-card
        primary: Apparaat klaar
