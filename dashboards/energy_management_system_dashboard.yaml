  - title: Verloop
    path: verloop
    subview: true
    type: sections
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Live

          - type: custom:mushroom-title-card
            title: Wat doet de integratie nu
            subtitle: >-
              Een lopend verhaal in gewone taal, samengesteld uit alle
              onderdelen (accu, apparaten, water, NILM, klimaat) - puur
              informatief, stuurt niets aan. Ververst elke tick vanzelf.

          - type: markdown
            content: >-
              {{
              state_attr('sensor.woonkamer_energy_management_system_wat_doet_de_integratie_nu',
              'verhaal') or 'Nog geen data verwerkt.' }}

          - type: markdown
            content: >-
              {% set ontbrekend =
              state_attr('sensor.woonkamer_energy_management_system_optionele_functies_nog_niet_geconfigureerd',
              'ontbrekend') or [] %}
              {% if ontbrekend | length > 0 %}
              **💡 {{ ontbrekend | length }} optionele functie(s) nog niet
              geconfigureerd:**

              {% for item in ontbrekend %}
              - **{{ item.naam }}** — ontgrendelt: {{ item.ontgrendelt }}
              {% endfor %}
              {% endif %}

      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Geschiedenis

          - type: history-graph
            title: Verwachte vs. werkelijke modus over tijd
            hours_to_show: 48
            entities:
              - entity: sensor.energy_management_system_expected_operation_mode
                name: Verwacht
              - entity: select.zendure_manager_operation
                name: Werkelijk
          - type: history-graph
            title: SoC & verbruik over tijd
            hours_to_show: 48
            entities:
              - entity: sensor.solarflow_2400_ac_electric_level
                name: SoC (%)
              - entity: sensor.solarflow_2400_ac_available_kwh
                name: Beschikbare kWh
              - entity: sensor.hw_p1_vermogen
                name: Verbruik (W)
          - type: history-graph
            title: Verbruiksprofiel (hele dag) & voorspelling-afwijking over tijd
            hours_to_show: 168
            entities:
              - entity: >-
                  sensor.woonkamer_energy_management_system_hourly_consumption_profile
                name: Verbruiksprofiel (huidig uur, W)
              - entity: sensor.energy_management_system_pv_forecast_accuracy
                name: PV-voorspelling afwijking (%)
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Beslissing en planning
            subtitle: Wat de aansturing nu doet en wat er gepland staat
          - type: custom:mushroom-template-card
            primary: >-
              {% set m = {'arbitrage_solar_capture': 'zonoverschot opvangen', 'default_smart': 'standaard slim laden', 'discharging_window': 'ontladen in duur blok', 'emergency_low_battery': 'noodladen bij lage accu', 'expensive_quarter': 'duur kwartier', 'expensive_quarter_no_own_load': 'duur kwartier, geen eigen verbruik', 'expensive_quarter_soc_protected': 'duur kwartier, accu beschermd', 'force_manual': 'handmatig overschreven', 'grid_charging_low_solar': 'bijladen bij weinig zon', 'grid_charging_low_solar_extra_dip': 'bijladen bij extra prijsdip', 'negative_price': 'negatieve prijs', 'no_forecast_data': 'geen prijsvoorspelling', 'post_salderen_solar_capture': 'zon opvangen na saldering'} %}{% set v = states('sensor.energy_management_system_last_decision_reason') %}{{ m.get(v, v if v not in ['unknown','unavailable',''] else 'nog geen beslissing') }}
            secondary: Laatste reden
            icon: mdi:comment-question-outline
            entity: sensor.energy_management_system_last_decision_reason
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            primary: >-
              {% set t = state_attr('sensor.energy_management_system_upcoming_schedule', 'transitions') or [] %}{% if t | length == 0 %}nog geen schema{% else %}{{ t | length }} blok(ken) gepland{% endif %}
            secondary: >-
              {% set t = state_attr('sensor.energy_management_system_upcoming_schedule', 'transitions') or [] %}{% if t | length > 0 %}Nu {{ t[0].get('mode') }} tot {{ as_timestamp(t[0].get('end')) | timestamp_custom('%H:%M') if t[0].get('end') else '?' }}{% if t | length > 1 %}, daarna {{ t[1].get('mode') }}{% endif %}{% else %}Komend schema{% endif %}
            multiline_secondary: true
            icon: mdi:calendar-clock
            entity: sensor.energy_management_system_upcoming_schedule
            tap_action:
              action: navigate
              navigation_path: /energy-management-system/details
          - type: custom:mushroom-template-card
            primary: >-
              {% set v = states('sensor.energy_management_system_simulated_action') %}{{ v if v not in ['unknown','unavailable',''] else 'simulatie draait niet' }}
            secondary: Gesimuleerde actie
            icon: mdi:flask-outline
            entity: sensor.energy_management_system_simulated_action
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: sensor.energy_management_system_cheapest_block_start
            name: Goedkoopste blok
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: sensor.energy_management_system_discharge_window_start
            name: Ontlaadvenster
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            primary: >-
              {% set v = states('sensor.energy_management_system_energy_bridge_check') %}{{ 'genoeg om uit te stellen' if v == 'enough_to_postpone' else ('bijladen nodig' if v == 'top_up_needed' else 'nog niet beoordeeld') }}
            secondary: Energie-check
            icon: mdi:clock-check-outline
            entity: sensor.energy_management_system_energy_bridge_check
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            primary: >-
              {% set v = states('sensor.energy_management_system_battery_protection') %}{{ v ~ ' W ontlaadgrens' if v not in ['unknown','unavailable',''] else 'geen grens actief' }}
            secondary: Accubescherming
            icon: mdi:battery-lock
            entity: sensor.energy_management_system_battery_protection
            tap_action:
              action: more-info

  - title: Details
    path: details
    subview: true
    type: sections
    max_columns: 1
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: custom:mushroom-title-card
            title: Details
            subtitle: De onderbouwing achter de samenvattingen

          - type: markdown
            title: Aandachtspunten
            content: |
              {% set p = state_attr('sensor.woonkamer_energy_management_system_system_status', 'aandachtspunten') or [] %}{% if p | length == 0 %}✅ Geen aandachtspunten.{% else %}{% for punt in p %}- {{ punt }}
              {% endfor %}{% endif %}


              {% set i = state_attr('sensor.woonkamer_energy_management_system_system_status', 'informatief') or [] %}{% if i | length > 0 %}**Ter info** (geen invloed op de status):

              {% for punt in i %}- {{ punt }}
              {% endfor %}{% endif %}

          - type: markdown
            title: Betrouwbaarheid per grootheid
            content: |
              {% set rijen = state_attr('sensor.woonkamer_energy_management_system_betrouwbaarheid_gegenereerde_data', 'regels') or [] %}{% if rijen | length == 0 %}Nog geen gegevens.{% else %}{% set ns = namespace(groep='') %}{% for r in rijen %}{% if r.get('groep') != ns.groep %}{% set ns.groep = r.get('groep') %}

              **{{ ns.groep }}**
              {% endif %}

              {{ r.get('label') }} **{{ r.get('naam') }}**{% if r.get('waarde') is not none %} — {{ r.get('waarde') }}{% endif %}  
              {{ r.get('reden') or '' }}

              {% endfor %}{% endif %}

          - type: markdown
            title: Verbetermogelijkheden
            content: |
              {% set a = state_attr('sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling', 'verbetermogelijkheden') or [] %}{% if a | length == 0 %}Geen verbetermogelijkheden gevonden.{% else %}{% for x in a %}**{{ x.onderwerp }}** — {{ x.waarneming }}

              {{ x.advies }}

              {% endfor %}{% endif %}

          - type: markdown
            title: Accumodules
            content: |
              {% set m = state_attr('sensor.woonkamer_energy_management_system_accu_modulegezondheid', 'modules') or [] %}{% if m | length == 0 %}Geen accumodule-sensoren geconfigureerd.{% else %}| Module | Celdelta | Temp | SoC | Vermogen |
              |---|---|---|---|---|
              {% for x in m %}| {{ loop.index }} | {{ x.get('cel_delta_v') }} V | {{ x.get('temperatuur_c') }} °C | {{ x.get('soc_percent') }}% | {{ x.get('vermogen_w') }} W |
              {% endfor %}{% endif %}

          - type: markdown
            title: Te beoordelen
            content: |
              {% set k = state_attr('sensor.woonkamer_energy_management_system_nilm_bevestigde_apparaten', 'kandidaat_naam') %}{% if k %}**Nieuw apparaat herkend:** {{ k }} ({{ state_attr('sensor.woonkamer_energy_management_system_nilm_bevestigde_apparaten', 'kandidaat_vermogen_w') }} W){% else %}Geen kandidaat op dit moment.{% endif %}

              {% set paren = state_attr('sensor.woonkamer_energy_management_system_nilm_bevestigde_apparaten', 'waarschijnlijke_duplicaten') or [] %}{% if paren | length > 0 %}**Mogelijke duplicaten:** {{ paren | length }}

              {% for pr in paren %}- {{ pr.get('apparaat_1') }} ↔ {{ pr.get('apparaat_2') }}
              {% endfor %}{% endif %}
            grid_options:
              columns: 12
              rows: auto

          - type: entities
            title: Beoordelen
            entities:
              - entity: button.woonkamer_energy_management_system_nilm_kandidaat_1_bevestigen
              - entity: button.woonkamer_energy_management_system_nilm_kandidaat_1_negeren
              - entity: button.woonkamer_energy_management_system_nilm_duplicaat_1_bevestigen
              - entity: button.woonkamer_energy_management_system_nilm_duplicaat_1_negeren
            grid_options:
              columns: 12
              rows: auto

          - type: markdown
            title: Herkende apparaten
            content: |
              {% set t = state_attr('sensor.woonkamer_energy_management_system_nilm_bevestigde_apparaten', 'tabel') or [] %}{% if t | length == 0 %}Nog geen apparaten herkend.{% else %}{{ state_attr('sensor.woonkamer_energy_management_system_nilm_bevestigde_apparaten', 'totaal_aantal') }} apparaten herkend; hieronder de eerste {{ t | length }}.

              | Apparaat | Nu | Trend |
              |---|---|---|
              {% for x in t %}| {{ x.get('naam') }} | {{ x.get('huidig_vermogen_w') if x.get('huidig_vermogen_w') is not none else '—' }} W | {{ x.get('trend') or '—' }} |
              {% endfor %}{% endif %}

          - type: markdown
            title: Woonkamertemperatuur per uur
            content: |
              {% set t = state_attr('sensor.woonkamer_energy_management_system_klimaat_projectie_woonkamertemperatuur', 'traject') or [] %}{% if t | length == 0 %}Nog geen projectie beschikbaar - de integratie leert per combinatie van buitentemperatuur, rolluikstand en airco.
              {% else %}| Uur | Snel | Betrouwbaar | Buiten | Basis | Metingen |
              |---|---|---|---|---|---|
              {% for u in t %}| {{ u.get('tijd') }} | {{ u.get('kort_termijn_temp_c') if u.get('kort_termijn_temp_c') is not none else '—' }} °C | {{ u.get('betrouwbaar_temp_c') if u.get('betrouwbaar_temp_c') is not none else '—' }} °C | {{ u.get('buitentemp_voorspeld_c') if u.get('buitentemp_voorspeld_c') is not none else '—' }} °C | {{ u.get('basis') or '—' }} | {{ u.get('aantal_metingen') if u.get('aantal_metingen') is not none else '—' }} |
              {% endfor %}{% endif %}

              **Snel** valt terug op naburige situaties zodra de exacte
              combinatie te dun bezet is; **Betrouwbaar** komt pas bij genoeg
              metingen in precies die situatie. De kolom Basis zegt waarop de
              snelle schatting rust.
            grid_options:
              columns: 12
              rows: auto

          - type: markdown
            title: Komend schema
            content: |
              {% set t = state_attr('sensor.energy_management_system_upcoming_schedule', 'transitions') or [] %}{% if t | length == 0 %}Nog geen schema berekend.{% else %}| Van | Tot | Modus | Prijs |
              |---|---|---|---|
              {% for b in t %}| {{ as_timestamp(b.get('start')) | timestamp_custom('%H:%M') if b.get('start') else '?' }} | {{ as_timestamp(b.get('end')) | timestamp_custom('%H:%M') if b.get('end') else '?' }} | {{ b.get('mode') }} | {{ '%.3f'|format(b.get('max_price_per_kwh')) if b.get('max_price_per_kwh') is not none else '—' }} €/kWh |
              {% endfor %}{% endif %}

          - type: markdown
            title: Waterverbruik vandaag
            content: |
              {% set alles = state_attr('sensor.woonkamer_energy_management_system_waterverbruik', 'recente_gebruiksmomenten') or [] %}{% set dag = now().strftime('%Y-%m-%d') %}{% set ns = namespace(v=[]) %}{% for s in alles %}{%- if s.gestart and dag in s.gestart %}{%- set ns.v = ns.v + [s] %}{%- endif %}{%- endfor %}{% if ns.v | length == 0 %}Nog geen gebruiksmomenten vandaag.{% else %}| Gestart | Duur | Volume |
              |---|---|---|
              {% for s in ns.v %}| {{ as_timestamp(s.gestart) | timestamp_custom('%H:%M') }} | {{ s.duur_minuten }} min | {{ s.liter }} L |
              {% endfor %}{% endif %}

          - type: custom:mushroom-title-card
            title: Zon en klimaat
            subtitle: Installatieprofiel, voorspelbias en airco
          - type: custom:mushroom-entity-card
            entity: sensor.woonkamer_energy_management_system_pv_installatieprofiel
            name: PV-installatieprofiel
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            primary: >-
              {% set v = states('sensor.woonkamer_energy_management_system_pv_hourly_forecast_bias') %}{{ v if v not in ['unknown','unavailable',''] else 'buiten daglichturen' }}
            secondary: >-
              {% set p = state_attr('sensor.woonkamer_energy_management_system_pv_hourly_forecast_bias', 'profile_confident') or {} %}PV-voorspelling bias{% if p | length > 0 %} · {{ p | length }} uren geleerd{% endif %}
            icon: mdi:weather-partly-cloudy
            entity: sensor.woonkamer_energy_management_system_pv_hourly_forecast_bias
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: sensor.woonkamer_energy_management_system_airco_verwachting_woonkamertemperatuur
            name: Airco-verwachting
            tap_action:
              action: more-info
