          {% if z.get('zonneplan_gas_vandaag_eur') is not none %}| 🔥 Gas vandaag | {{ z.get('zonneplan_gas_vandaag_eur') | round(2) }} € |
          | **🏠 Totale energiekosten vandaag** | **{{ z.get('totale_energiekosten_vandaag_eur') }} €** |
          {% endif %}


          {{ z.get('reden') }}


          _Beide getallen meten dezelfde P1-meter, dus dit toetst de
          prijsafhandeling — niet de accu-boekhouding of de
          tegenfeitelijke besparing. Gas wordt alleen getoond, niet
          getoetst._{% endif %}

