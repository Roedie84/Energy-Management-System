  - title: Kwaliteit
    path: kwaliteit
    cards:
      - type: markdown
        content: |
          Alleen de conclusie per onderwerp. Klopt er iets niet, dan komt
          dat als **melding** binnen — daar hoef je dit tabblad niet voor
          open te hebben.


          De volledige onderbouwing blijft beschikbaar: tik op een kaart
          voor alle attributen, of download de diagnostiek-export.

      - type: custom:mushroom-template-card
        primary: Betrouwbaarheid van de metingen
        secondary: >-
          {% set s = (state_attr('sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling', 'samenvattingen') or {}).get('kwaliteit') or {} %}{{ s.get('zin', 'Nog geen gegevens.') }}
