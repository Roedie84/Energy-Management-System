title: Energy Management System
views:
  - title: Overzicht
    path: overzicht
    type: sections
    sections:


      - type: grid
        cards:
          - type: markdown
            content: >-
              {% set punten = state_attr('sensor.woonkamer_energy_management_system_system_status', 'aandachtspunten') or [] %}{% if punten | length == 0 %}✅ Geen aandachtspunten.{% else %}**⚠️ {{ punten | length }} aandachtspunt(en)** — hiervan krijg je een melding. Tik op de statuskaart voor de details.{% endif %}
            grid_options:
              columns: 12
              rows: auto
          - type: heading
            heading: Accu, rendement & live cijfers
            grid_options:
              columns: 12
              rows: 1
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.solarflow_2400_ac_electric_level') }}%"
            secondary: Accu SoC
            icon: mdi:battery-charging-medium
            icon_color: >-
              {% set v = states('sensor.solarflow_2400_ac_electric_level') | float(0) %}
              {% if v >= 40 %}green{% elif v >= 20 %}yellow{% else %}red{% endif %}
            entity: sensor.solarflow_2400_ac_electric_level
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-template-card
            primary: >-
              {{ states('sensor.woonkamer_energy_management_system_learned_battery_efficiency') }}%
            secondary: Geleerd rendement
            icon: mdi:battery-sync-outline
            icon_color: >-
              {% set v = states('sensor.woonkamer_energy_management_system_learned_battery_efficiency') | float(0) %}
              {% if v >= 75 %}green{% elif v >= 60 %}yellow{% else %}red{% endif %}
            entity: sensor.woonkamer_energy_management_system_learned_battery_efficiency
            grid_options:
              columns: 6
              rows: 1
          - type: markdown
            content: >
              {%- set history =
              state_attr('sensor.woonkamer_energy_management_system_learned_battery_efficiency',
              'history') or [] %}

              {%- if history|length >= 2 %}

              {%- set previous = history[-2] %}

              {%- set current = history[-1] %}

              {%- set diff = current - previous %}

              Rendement {{ '↑' if diff > 0 else ('↓' if diff < 0 else '→') }} vorige
              meting was {{ previous }}% ({{ '%+.1f'|format(diff) }}%)

              {%- else %}

              Nog niet genoeg metingen voor een trend

              {%- endif %}
            grid_options:
              columns: 12
              rows: 1
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.solarflow_2400_ac_available_kwh') }} kWh"
            secondary: Beschikbare energie
            icon: mdi:battery-high
            icon_color: green
            entity: sensor.solarflow_2400_ac_available_kwh
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.hw_p1_vermogen') }} W"
            secondary: Netstroom, P1 (kan negatief zijn bij export)
            icon: mdi:transmission-tower
            icon_color: orange
            entity: sensor.hw_p1_vermogen
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-template-card
            primary: >-
              {{ states('sensor.woonkamer_energy_management_system_huishoudverbruik_werkelijk') }} W
            secondary: Werkelijk huishoudverbruik
            icon: mdi:home-lightning-bolt-outline
            icon_color: amber
            entity: sensor.woonkamer_energy_management_system_huishoudverbruik_werkelijk
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-template-card
            primary: >-
              {{
              states('sensor.woonkamer_energy_management_system_current_price_used_by_integration')
              }} €/kWh
            secondary: Huidige prijs
            icon: mdi:cash-sync
            icon_color: blue
            entity: >-
              sensor.woonkamer_energy_management_system_current_price_used_by_integration
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-template-card
            primary: >-
              {% set s = 'sensor.woonkamer_energy_management_system_accu_koeling' %}{% set accu = state_attr(s, 'accu_c') %}{{ (accu ~ ' °C') if accu is not none else states(s) }}
            secondary: >-
              {% set s = 'sensor.woonkamer_energy_management_system_accu_koeling' %}{% set st = states(s) %}Accu-koeling: {{ st }}
            icon: mdi:fan
            icon_color: >-
              {% set st = states('sensor.woonkamer_energy_management_system_accu_koeling') %}{% if st == 'koelt' %}blue{% elif st == 'uit' %}grey{% else %}orange{% endif %}
            entity: sensor.woonkamer_energy_management_system_accu_koeling
            tap_action:
              action: more-info
            grid_options:
              columns: 6
              rows: 1

      - type: grid
        cards:
          - type: heading
            heading: Modus & besluit
            grid_options:
              columns: 12
              rows: 1
          - type: custom:mushroom-template-card
            primary: "{{ states('select.zendure_manager_operation') }}"
            secondary: Werkelijke modus (Zendure — alleen weergave)
            icon: mdi:battery-sync
            icon_color: cyan
            entity: select.zendure_manager_operation
            tap_action:
              action: none
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-template-card
            primary: >-
              {{
              states('sensor.energy_management_system_expected_operation_mode')
              }}
            secondary: Verwachte modus (logica)
            icon: mdi:brain
            icon_color: purple
            entity: sensor.energy_management_system_expected_operation_mode
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-template-card
            primary: >-
              {{
              states('sensor.energy_management_system_effective_expensive_quarters')
              }} kwartieren
            secondary: Boven prijsdrempel (hele dag, capaciteit-begrensd)
            icon: mdi:chart-bell-curve
            icon_color: red
            entity: sensor.energy_management_system_effective_expensive_quarters
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-template-card
            primary: "{{ states('number.solaredge_i1_active_power_limit') }}%"
            secondary: Zonnepaneel-vermogenslimiet (bij negatieve prijs)
            icon: mdi:solar-power-variant
            icon_color: amber
            entity: number.solaredge_i1_active_power_limit
            tap_action:
              action: none
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-template-card
            primary: >-
              {% set source = state_attr('sensor.woonkamer_energy_management_system_explanation', 'heavy_load_source') %}
              {{ {'vaatwasser': 'Vaatwasser', 'wasmachine': 'Wasmachine', 'quooker': 'Quooker', 'airco': 'Airco', 'oven': 'Oven', 'kookplaat': 'Kookplaat'}.get(source, 'Geen') }}
            secondary: Grootverbruiker bevestigd actief (omzeilt mediaan-vertraging)
            icon: >-
              {{ 'mdi:lightning-bolt' if
              state_attr('sensor.woonkamer_energy_management_system_explanation', 'heavy_load_source')
              else 'mdi:lightning-bolt-outline' }}
            icon_color: >-
              {{ 'orange' if
              state_attr('sensor.woonkamer_energy_management_system_explanation', 'heavy_load_source')
              else 'grey' }}
            entity: sensor.woonkamer_energy_management_system_explanation
            tap_action:
              action: none
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 1

      - type: grid
        cards:
          - type: heading
            heading: Besturing
            grid_options:
              columns: 12
              rows: 1
          - type: custom:mushroom-entity-card
            entity: switch.energy_management_system_force_manual
            name: Force manual
            icon: mdi:hand-back-right
            grid_options:
              columns: 4
              rows: 1
          - type: custom:mushroom-entity-card
            entity: switch.energy_management_system_learning_only_no_control
            name: Learning only
            icon: mdi:school-outline
            grid_options:
              columns: 4
              rows: 1
          - type: custom:mushroom-entity-card
            entity: switch.woonkamer_energy_management_system_vacation_mode
            name: Vakantiemodus
            icon: mdi:bag-suitcase-outline
            grid_options:
              columns: 4
              rows: 1
          - type: custom:mushroom-entity-card
            entity: button.woonkamer_energy_management_system_test_notificatie_versturen
            name: Test notificatie
            icon: mdi:bell-ring-outline
            grid_options:
              columns: 4
              rows: 1
          - type: custom:mushroom-entity-card
            entity: switch.woonkamer_energy_management_system_steelstofzuiger_overrule
            name: Steelstofzuiger overrule
            icon: mdi:hand-back-right-outline
            grid_options:
              columns: 4
              rows: 1
          - type: custom:mushroom-entity-card
            entity: switch.woonkamer_energy_management_system_fietsladers_overrule
            name: Fietsladers overrule
            icon: mdi:hand-back-right-outline
            grid_options:
              columns: 4
              rows: 1
          - type: custom:mushroom-entity-card
            entity: switch.woonkamer_energy_management_system_vaatwasser_wasmachine_meldingen
            name: Vaatwasser/wasmachine-meldingen
            icon: mdi:bell-outline
            grid_options:
              columns: 4
              rows: 1

  - title: Visueel
    path: visueel
    # panel: true laat deze ene kaart de volledige breedte en hoogte
    # vullen - precies waar een panel-view voor bedoeld is en de enige
    # manier om de tekening op een groot scherm echt tot zijn recht te
    # laten komen. Een panel-view mag exact één kaart bevatten.
    panel: true
    cards:
      - type: picture-elements
        # v0.63.131: de ?v= is GEEN opsmuk maar noodzakelijk.
        # /local/ serveert een statisch bestand onder een vaste naam,
        # dus browsers (en de HA-app) blijven de oude tekening tonen
        # terwijl de waarden er live overheen komen - gerapporteerd als
        # "richtingen van de stromen nog niet geupdate?". De
        # versiesleutel dwingt een verse ophaal af. Een test bewaakt
        # dat deze waarde gelijk blijft aan de versie in manifest.json.
        image: /local/energy_management_system_overview.svg?v=1.12.2
