      - type: markdown
        title: Maandoverzicht (t.o.v. vorige maand)
        content: >
          {%- set cur_discharge =
          state_attr('sensor.woonkamer_energy_management_system_monthly_summary',
          'current_month_discharge_value_eur') or 0 %}

          {%- set cur_cost =
          state_attr('sensor.woonkamer_energy_management_system_monthly_summary',
          'current_month_charge_cost_eur') or 0 %}

          {%- set cur_net = cur_discharge - cur_cost %}

          {%- set prev_net =
          state_attr('sensor.woonkamer_energy_management_system_monthly_summary',
          'previous_month_net_eur') %}

          **Deze maand tot nu toe:** € {{ '%.2f'|format(cur_net) }} netto ({{
          '%.2f'|format(cur_discharge) }} ontladen − {{ '%.2f'|format(cur_cost)
          }} netladen)


          {%- if prev_net is not none %}

          **Vorige maand:** € {{ '%.2f'|format(prev_net) }} netto

          {%- set diff = cur_net - prev_net %}

          {{ '↑' if diff > 0 else ('↓' if diff < 0 else '→') }} {{
          '%+.2f'|format(diff) }} ten opzichte van dezelfde periode vorige
          maand

          {%- else %}

          Nog geen vorige maand om mee te vergelijken — dat verschijnt na de
          eerste maandwisseling.

          {%- endif %}

      - type: markdown
        title: Energiekosten — week, maand, jaar en trend
        content: |
          {% set e = 'sensor.woonkamer_energy_management_system_besparing_t_o_v_zonder_accu_sturing' %}
          {% set o = state_attr(e, 'energiekosten_overzicht') %}
          {% if o is none %}Nog geen gegevens.{% else %}
          {% set nu = o.get('vandaag_tot_nu_toe') or {} %}
          **Vandaag tot nu toe:** stroom {{ nu.get('stroom_eur') if nu.get('stroom_eur') is not none else '—' }} € · gas {{ nu.get('gas_eur') if nu.get('gas_eur') is not none else '—' }} €


          {% if o.get('voltooide_dagen', 0) == 0 %}Er zijn nog geen voltooide dagen. Week-, maand- en jaarcijfers verschijnen zodra er dagen zijn afgesloten.{% else %}
          | | Stroom | Gas |
          |---|---|---|
          {% for label, sleutel in [('7 dagen', 'week'), ('30 dagen', 'maand'), ('365 dagen', 'jaar')] %}| {{ label }} | {{ o.stroom.get(sleutel) if o.stroom.get(sleutel) is not none else '—' }} € | {{ o.gas.get(sleutel) if o.gas.get(sleutel) is not none else '—' }} € |
          {% endfor %}


          **Trends** (alleen voltooide dagen)

          | | Stroom | Gas |
          |---|---|---|
          | Gisteren t.o.v. eergisteren | {% if o.stroom.get('dagtrend_procent') is not none %}{{ '📈' if o.stroom.dagtrend_procent > 0 else '📉' }} {{ o.stroom.dagtrend_procent }}%{% else %}—{% endif %} | {% if o.gas.get('dagtrend_procent') is not none %}{{ '📈' if o.gas.dagtrend_procent > 0 else '📉' }} {{ o.gas.dagtrend_procent }}%{% else %}—{% endif %} |
          | Deze week t.o.v. vorige | {% if o.stroom.get('weektrend_procent') is not none %}{{ '📈' if o.stroom.weektrend_procent > 0 else '📉' }} {{ o.stroom.weektrend_procent }}%{% else %}—{% endif %} | {% if o.gas.get('weektrend_procent') is not none %}{{ '📈' if o.gas.weektrend_procent > 0 else '📉' }} {{ o.gas.weektrend_procent }}%{% else %}—{% endif %} |


          📈 betekent duurder dan de vorige periode, 📉 goedkoper.


          {{ o.get('note') }}
          {% endif %}{% endif %}

