          {% set e = 'sensor.woonkamer_energy_management_system_besparing_t_o_v_zonder_accu_sturing' %}{% set z = state_attr(e, 'zonneplan_vergelijking') %}{% if z is none or z.get('status') == 'niet_geconfigureerd' %}Geen Zonneplan-kostensensoren gevonden. Veel daarvan staan standaard uit in Home Assistant — schakel ze in bij Instellingen → Apparaten & services → Zonneplan → entiteiten, dan verschijnt hier de vergelijking met je werkelijke afrekening.{% else %}| Post | Bedrag |
