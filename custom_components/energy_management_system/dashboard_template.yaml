- title: Meldingen
  path: meldingen
  subview: true
  cards:
  - type: custom:mushroom-template-card
    primary: Achterhoeks
    secondary: '{{ ''AAN'' if is_state(''switch.woonkamer_energy_management_system_meldingen_in_het_achterhoeks'', ''on'') else ''uit'' }} · meldingen en telefoon'
    icon: mdi:translate
    icon_color: '{{ ''green'' if is_state(''switch.woonkamer_energy_management_system_meldingen_in_het_achterhoeks'', ''on'') else ''grey'' }}'
    entity: switch.woonkamer_energy_management_system_meldingen_in_het_achterhoeks
    tap_action:
      action: toggle
    grid_options:
      columns: 12
      rows: auto
  - type: markdown
    content: 'Meldingen gaan naar de notify-service die bij Configureren is

      ingesteld. Is die er niet, dan verschijnen ze als melding in

      Home Assistant zelf.



      **Alleen de zes meldingen die er al waren staan standaard aan.**

      Alles wat later is toegevoegd begint uit — twintig meldingen die

      zichzelf aanzetten is een garantie dat je er binnen een week

      niets meer van leest.



      Elke melding heeft een eigen **dempingsvenster**: binnen die tijd

      gaat dezelfde melding niet nog een keer af. Bij modus-wijzigingen

      en sluipverbruik is dat het verschil tussen bruikbaar en

      wegswipen. Tik op een melding om te schakelen, houd vast voor de

      details.

      '
  - type: custom:mushroom-template-card
    primary: '{{ ''Alle meldingen AAN'' if is_state(''switch.woonkamer_energy_management_system_meldingen_hoofdschakelaar'', ''on'') else ''Alle meldingen UIT'' }}'
