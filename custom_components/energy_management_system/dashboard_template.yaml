title: Energy Management System
views:
- title: Overzicht
  path: overzicht
  type: sections
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-template-card
      primary: '{% set p = state_attr(''sensor.woonkamer_energy_management_system_system_status'', ''aandachtspunten'') or [] %}{{ ''✅ Geen aandachtspunten'' if p | length == 0 else ''⚠️ '' ~ p | length ~ '' aandachtspunt(en)'' }}'
      secondary: '{% set p = state_attr(''sensor.woonkamer_energy_management_system_system_status'', ''aandachtspunten'') or [] %}{{ ''Alles in orde.'' if p | length == 0 else (p[0].split(''.'')[0] ~ ''. Tik voor alle details.'') }}'
      multiline_secondary: true
      icon: '{% set p = state_attr(''sensor.woonkamer_energy_management_system_system_status'', ''aandachtspunten'') or [] %}{{ ''mdi:check-circle-outline'' if p | length == 0 else ''mdi:alert-outline'' }}'
      icon_color: '{% set p = state_attr(''sensor.woonkamer_energy_management_system_system_status'', ''aandachtspunten'') or [] %}{{ ''green'' if p | length == 0 else ''orange'' }}'
      entity: sensor.woonkamer_energy_management_system_system_status
      tap_action:
        action: navigate
        navigation_path: /energy-management-system/detail-kwaliteit
      grid_options:
        columns: 12
        rows: auto
    - type: markdown
      content: '{% set p = state_attr(''sensor.woonkamer_energy_management_system_system_status'', ''aandachtspunten'') or [] %}{% set i = state_attr(''sensor.woonkamer_energy_management_system_system_status'', ''informatief'') or [] %}{% if p | length == 0 and i | length == 0 %}✅ Geen aandachtspunten.{% else %}{% for punt in p %}⚠️ {{ punt }}

        {% endfor %}{% for punt in i %}ℹ️ {{ punt }}

        {% endfor %}{% endif %}'
      grid_options:
        columns: 12
        rows: auto
    - type: heading
      heading: Accu, rendement & live cijfers
      grid_options:
        columns: 12
        rows: 1
    - type: custom:mushroom-template-card
      primary: '{{ states(''sensor.solarflow_2400_ac_electric_level'') }}%'
      secondary: Accu SoC
      icon: mdi:battery-charging-medium
      icon_color: '{% set v = states(''sensor.solarflow_2400_ac_electric_level'') | float(0) %} {% if v >= 40 %}green{% elif v >= 20 %}yellow{% else %}red{% endif %}'
      entity: sensor.solarflow_2400_ac_electric_level
      grid_options:
        columns: 12
        rows: auto
      tap_action:
        action: more-info
    - type: custom:mushroom-template-card
      primary: '{{ states(''sensor.woonkamer_energy_management_system_learned_battery_efficiency'') }}%'
      secondary: Geleerd rendement
      icon: mdi:battery-sync-outline
      icon_color: '{% set v = states(''sensor.woonkamer_energy_management_system_learned_battery_efficiency'') | float(0) %} {% if v >= 75 %}green{% elif v >= 60 %}yellow{% else %}red{% endif %}'
      entity: sensor.woonkamer_energy_management_system_learned_battery_efficiency
      grid_options:
        columns: 12
        rows: auto
      tap_action:
        action: more-info
    - type: markdown
      content: '{%- set history = state_attr(''sensor.woonkamer_energy_management_system_learned_battery_efficiency'', ''history'') or [] %}

        {%- if history|length >= 2 %}

        {%- set laatste = history[-1] %}

        {%- set vorige = history[-2] %}

        {%- set verschil = laatste - vorige %}

        Laatste laadcyclus {{ ''%.1f''|format(laatste) }}%, daarvoor {{ ''%.1f''|format(vorige) }}% ({{ ''%+.1f''|format(verschil) }} procentpunt). De tegel hierboven toont de mediaan over {{ history|length }} cycli - één afwijkende cyclus telt daar bewust nauwelijks in mee.

        {%- else %}

        Nog niet genoeg metingen voor een trend

        {%- endif %}

        '
      grid_options:
        columns: 12
        rows: auto
    - type: custom:mushroom-template-card
      primary: '{{ states(''sensor.solarflow_2400_ac_available_kwh'') }} kWh'
      secondary: Beschikbare energie
      icon: mdi:battery-high
      icon_color: green
      entity: sensor.solarflow_2400_ac_available_kwh
      grid_options:
        columns: 12
        rows: auto
      tap_action:
        action: more-info
    - type: custom:mushroom-template-card
      primary: '{{ states(''sensor.hw_p1_vermogen'') }} W'
      secondary: Netstroom (P1)
      icon: mdi:transmission-tower
      icon_color: orange
      entity: sensor.hw_p1_vermogen
      grid_options:
        columns: 12
        rows: auto
      tap_action:
        action: more-info
    - type: custom:mushroom-template-card
      primary: '{{ states(''sensor.woonkamer_energy_management_system_huishoudverbruik_werkelijk'') }} W'
      secondary: Huishoudverbruik
      icon: mdi:home-lightning-bolt-outline
      icon_color: amber
      entity: sensor.woonkamer_energy_management_system_huishoudverbruik_werkelijk
      grid_options:
        columns: 12
        rows: auto
      tap_action:
        action: more-info
    - type: custom:mushroom-template-card
      primary: '{{ states(''sensor.woonkamer_energy_management_system_current_price_used_by_integration'') }} €/kWh'
      secondary: Huidige prijs
      icon: mdi:cash-sync
      icon_color: blue
      entity: sensor.woonkamer_energy_management_system_current_price_used_by_integration
      grid_options:
        columns: 12
        rows: auto
      tap_action:
        action: more-info
    - type: custom:mushroom-template-card
      primary: '{% set s = ''sensor.woonkamer_energy_management_system_accu_koeling'' %}{% set accu = state_attr(s, ''accu_c'') %}{{ (accu ~ '' °C'') if accu is not none else states(s) }}'
      secondary: '{% set s = ''sensor.woonkamer_energy_management_system_accu_koeling'' %}{% set st = states(s) %}Accu-koeling: {{ st }}'
      icon: mdi:fan
      icon_color: '{% set st = states(''sensor.woonkamer_energy_management_system_accu_koeling'') %}{% if st == ''koelt'' %}blue{% elif st == ''uit'' %}grey{% else %}orange{% endif %}'
      entity: sensor.woonkamer_energy_management_system_accu_koeling
      tap_action:
        action: more-info
      grid_options:
        columns: 12
        rows: auto
    - type: heading
      heading: Modus & besluit
      grid_options:
        columns: 12
        rows: 1
    - type: custom:mushroom-template-card
      primary: '{{ states(''select.zendure_manager_operation'') }}'
      secondary: Werkelijke modus
      icon: mdi:battery-sync
      icon_color: cyan
      entity: select.zendure_manager_operation
      tap_action:
        action: none
      hold_action:
        action: none
      grid_options:
        columns: 12
        rows: auto
    - type: custom:mushroom-template-card
      primary: '{{ states(''sensor.energy_management_system_expected_operation_mode'') }}'
      secondary: Verwachte modus
      icon: mdi:brain
      icon_color: purple
      entity: sensor.energy_management_system_expected_operation_mode
      grid_options:
        columns: 12
        rows: auto
      tap_action:
        action: more-info
    - type: custom:mushroom-template-card
      primary: '{{ states(''sensor.energy_management_system_effective_expensive_quarters'') }} kwartieren'
      secondary: Boven prijsdrempel
      icon: mdi:chart-bell-curve
      icon_color: red
      entity: sensor.energy_management_system_effective_expensive_quarters
      grid_options:
        columns: 12
        rows: auto
      tap_action:
        action: more-info
    - type: custom:mushroom-template-card
      primary: '{{ states(''number.solaredge_i1_active_power_limit'') }}%'
      secondary: PV-limiet
      icon: mdi:solar-power-variant
      icon_color: amber
      entity: number.solaredge_i1_active_power_limit
      tap_action:
        action: none
      hold_action:
        action: none
      grid_options:
        columns: 12
        rows: auto
    - type: custom:mushroom-template-card
      primary: '{% set source = state_attr(''sensor.woonkamer_energy_management_system_explanation'', ''heavy_load_source'') %} {{ {''vaatwasser'': ''Vaatwasser'', ''wasmachine'': ''Wasmachine'', ''quooker'': ''Quooker'', ''airco'': ''Airco'', ''oven'': ''Oven'', ''kookplaat'': ''Kookplaat''}.get(source, ''Geen'') }}'
      secondary: Grootverbruiker actief
      icon: '{{ ''mdi:lightning-bolt'' if state_attr(''sensor.woonkamer_energy_management_system_explanation'', ''heavy_load_source'') else ''mdi:lightning-bolt-outline'' }}'
      icon_color: '{{ ''orange'' if state_attr(''sensor.woonkamer_energy_management_system_explanation'', ''heavy_load_source'') else ''grey'' }}'
      entity: sensor.woonkamer_energy_management_system_explanation
      tap_action:
        action: none
      hold_action:
        action: none
      grid_options:
        columns: 12
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Haalt de accu het?
      heading_style: title
    - type: markdown
      content: '{% set q = state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''kwartier_samenvatting'') or {} %}{% if not q.get(''beschikbaar'') %}Nog geen planning.{% else %}{% set t = q.get(''tekort_kwartieren'', 0) %}{% if t > 0 %}**Nee: {{ t }} kwartier(en) aan het net** — {{ (q.get(''tekort_perioden'') or [])[:2] | join('', '') }}.{% else %}**Ja**, geen kwartier zonder accu.{% endif %} Laagste {{ q.get(''laagste_soc_tot_bijladen_procent'', ''—'') }}%, eind {{ q.get(''eind_soc_procent'', ''—'') }}%, € {{ q.get(''verwachte_opbrengst_eur'', ''—'') }} over {{ ((q.get(''kwartieren'', 0) / 4) | int) }} uur.{% endif %}'
      grid_options:
        columns: 12
        rows: auto
    - type: markdown
      content: '{% set w = state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''waarom_nu'') or {} %}{% if not w.get(''beschikbaar'') %}{{ w.get(''reden'', ''Nog geen beslissing.'') }}{% else %}**{{ w.vraag }}**

        {% for r in w.redenen %}→ {{ r }}

        {% endfor %}{% endif %}'
      grid_options:
        columns: 12
        rows: auto
    - type: heading
      heading: Besturing
      grid_options:
        columns: 12
        rows: 1
    - type: custom:mushroom-entity-card
      entity: switch.energy_management_system_force_manual
      name: Force manual
      icon: mdi:hand-back-right
      grid_options:
        columns: 12
        rows: auto
    - type: custom:mushroom-entity-card
      entity: switch.energy_management_system_learning_only_no_control
      name: Learning only
      icon: mdi:school-outline
      grid_options:
        columns: 12
        rows: auto
    - type: custom:mushroom-entity-card
      entity: switch.woonkamer_energy_management_system_vacation_mode
      name: Vakantiemodus
      icon: mdi:bag-suitcase-outline
      grid_options:
        columns: 12
        rows: auto
    - type: custom:mushroom-template-card
      primary: '{% set e = ''switch.woonkamer_energy_management_system_nu_laden'' %}{% set a = state_attr(e, ''resterend'') %}{{ ''Nu laden — nog '' ~ a if is_state(e, ''on'') and a else ''Nu laden'' }}'
      secondary: '{% set e = ''switch.woonkamer_energy_management_system_nu_laden'' %}{% set k = state_attr(e, ''kost_eur'') %}{% if is_state(e, ''on'') %}{{ state_attr(e, ''toelichting'') }}{% if k %} Kost ca. € {{ k }}.{% endif %}{% elif k %}Zet het uitstel opzij; kost naar schatting € {{ k }}.{% else %}Er wordt nu niets uitgesteld.{% endif %}'
      multiline_secondary: true
      icon: mdi:battery-charging-high
      icon_color: '{{ ''orange'' if is_state(''switch.woonkamer_energy_management_system_nu_laden'', ''on'') else ''grey'' }}'
      entity: switch.woonkamer_energy_management_system_nu_laden
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      grid_options:
        columns: 12
        rows: auto
    - type: custom:mushroom-entity-card
      entity: button.woonkamer_energy_management_system_test_notificatie_versturen
      name: Testmelding
      icon: mdi:bell-ring-outline
      grid_options:
        columns: 12
        rows: auto
    - type: custom:mushroom-entity-card
      entity: switch.woonkamer_energy_management_system_steelstofzuiger_overrule
      name: Stofzuiger
      icon: mdi:hand-back-right-outline
      grid_options:
        columns: 12
        rows: auto
    - type: custom:mushroom-entity-card
      entity: switch.woonkamer_energy_management_system_fietsladers_overrule
      name: Fietsladers
      icon: mdi:hand-back-right-outline
      grid_options:
        columns: 12
        rows: auto
    - type: custom:mushroom-entity-card
      entity: switch.woonkamer_energy_management_system_vaatwasser_wasmachine_meldingen
      name: Apparaten
      icon: mdi:bell-outline
      grid_options:
        columns: 12
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Status per onderwerp
      grid_options:
        columns: 12
        rows: 1
    - type: custom:mushroom-template-card
      primary: PV / zon
      secondary: '{% set s = (state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''samenvattingen'') or {}).get(''zon'') or {} %}{{ s.get(''zin'', ''Nog geen gegevens.'') }}'
      multiline_secondary: true
      icon: mdi:solar-power
      icon_color: '{% set n = ((state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''samenvattingen'') or {}).get(''zon'') or {}).get(''niveau'') %}{{ ''red'' if n == ''onbetrouwbaar'' else (''green'' if n == ''betrouwbaar'' else ''orange'') }}'
      entity: sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling
      tap_action:
        action: navigate
        navigation_path: /energy-management-system/detail-zon
      grid_options:
        columns: 12
        rows: auto
    - type: custom:mushroom-template-card
      primary: Accumodules
      secondary: '{% set s = (state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''samenvattingen'') or {}).get(''accumodules'') or {} %}{{ s.get(''zin'', ''Nog geen gegevens.'') }}'
      multiline_secondary: true
      icon: mdi:battery-heart-variant
      icon_color: '{% set n = ((state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''samenvattingen'') or {}).get(''accumodules'') or {}).get(''niveau'') %}{{ ''red'' if n == ''onbetrouwbaar'' else (''green'' if n == ''betrouwbaar'' else ''orange'') }}'
      entity: sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling
      tap_action:
        action: navigate
