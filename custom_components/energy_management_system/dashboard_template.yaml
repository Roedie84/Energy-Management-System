title: Energy Management System
views:
  - title: Overzicht
    path: overzicht
    type: sections
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.woonkamer_energy_management_system_system_status') }}"
            secondary: >-
              {% set t =
              state_attr('sensor.woonkamer_energy_management_system_system_status',
              'last_successful_update') %}
              {{ as_timestamp(t) | timestamp_custom('%a %H:%M:%S') if t else 'nog geen succesvolle update' }}
              {% set punten = state_attr('sensor.woonkamer_energy_management_system_system_status', 'aandachtspunten') or [] %}
              {% if punten | length > 0 %} — {{ punten | length }} aandachtspunt(en){% endif %}
            icon: >-
              {% set status = states('sensor.woonkamer_energy_management_system_system_status') %}
              {% if status == 'OK' %}mdi:check-circle-outline
              {%- elif status == 'Aandacht gewenst' %}mdi:alert-outline
              {%- else %}mdi:alert-circle-outline{% endif %}
            icon_color: >-
              {% set status = states('sensor.woonkamer_energy_management_system_system_status') %}
              {% if status == 'OK' %}green
              {%- elif status == 'Aandacht gewenst' %}orange
              {%- else %}red{% endif %}
            entity: sensor.woonkamer_energy_management_system_system_status
            tap_action:
              action: more-info
            grid_options:
              columns: 12
              rows: 1
          - type: markdown
            content: >-
              {% set punten =
              state_attr('sensor.woonkamer_energy_management_system_system_status',
              'aandachtspunten') or [] %}
              {% set info =
              state_attr('sensor.woonkamer_energy_management_system_system_status',
              'informatief') or [] %}
              {% if punten | length > 0 %}
              **⚠️ Aandachtspunten:**

              {% for punt in punten %}
              - {{ punt }}
              {% endfor %}
              {% endif %}
              {% if info | length > 0 %}
              **ℹ️ Ter info (geen invloed op de status):**

              {% for punt in info %}
              - {{ punt }}
              {% endfor %}
              {% endif %}
            grid_options:
              columns: 12
              rows: auto
          - type: markdown
            content: |
              {% set updated = state_attr('sensor.woonkamer_energy_management_system_explanation', 'last_successful_update') %}{% set fm = state_attr('sensor.woonkamer_energy_management_system_explanation', 'force_manual') %}{% set mode = state_attr('sensor.woonkamer_energy_management_system_explanation', 'expected_mode') %}{% set price = state_attr('sensor.woonkamer_energy_management_system_explanation', 'current_price_per_kwh') %}{% set threshold = state_attr('sensor.woonkamer_energy_management_system_explanation', 'expensive_price_threshold') %}{% set count = state_attr('sensor.woonkamer_energy_management_system_explanation', 'effective_expensive_quarters_count') %}| — | — |
              |---|---|
              | 🕐 **Tijd:** {{ as_timestamp(updated) | timestamp_custom('%d-%m %H:%M') if updated else 'onbekend' }} | 🔒 **Force manual:** {{ 'aan' if fm else 'uit' }} |
              | ⚙️ **Modus:** {{ mode if mode else 'onbekend' }} | 💰 **Prijs:** {{ '€%.3f/kWh' | format(price) if price is not none else 'onbekend' }} |
              | 📈 **Drempel duur:** {{ '€%.3f/kWh' | format(threshold) if threshold is not none else 'n.v.t.' }} | 🎯 **Dure kwartieren:** {{ count if count is not none else 0 }} |

              {{ state_attr('sensor.woonkamer_energy_management_system_explanation', 'explanation') }}
            grid_options:
              columns: 12
              rows: auto

      - type: grid
        cards:
          - type: heading
            heading: Accu, rendement & live cijfers
            grid_options:
              columns: 12
              rows: 1
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.solarflow_2400_ac_electric_level') }}%"
            secondary: Accu SoC
            icon: mdi:battery-charging-medium
            icon_color: >-
              {% set v = states('sensor.solarflow_2400_ac_electric_level') | float(0) %}
              {% if v >= 40 %}green{% elif v >= 20 %}yellow{% else %}red{% endif %}
            entity: sensor.solarflow_2400_ac_electric_level
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-template-card
            primary: >-
              {{ states('sensor.woonkamer_energy_management_system_learned_battery_efficiency') }}%
            secondary: Geleerd rendement
            icon: mdi:battery-sync-outline
            icon_color: >-
              {% set v = states('sensor.woonkamer_energy_management_system_learned_battery_efficiency') | float(0) %}
              {% if v >= 75 %}green{% elif v >= 60 %}yellow{% else %}red{% endif %}
            entity: sensor.woonkamer_energy_management_system_learned_battery_efficiency
            grid_options:
              columns: 6
              rows: 1
          - type: markdown
            content: >
              {%- set history =
              state_attr('sensor.woonkamer_energy_management_system_learned_battery_efficiency',
              'history') or [] %}

              {%- if history|length >= 2 %}

              {%- set previous = history[-2] %}

              {%- set current = history[-1] %}

              {%- set diff = current - previous %}

              Rendement {{ '↑' if diff > 0 else ('↓' if diff < 0 else '→') }} vorige
              meting was {{ previous }}% ({{ '%+.1f'|format(diff) }}%)

              {%- else %}

              Nog niet genoeg metingen voor een trend

              {%- endif %}
            grid_options:
              columns: 12
              rows: 1
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.solarflow_2400_ac_available_kwh') }} kWh"
            secondary: Beschikbare energie
            icon: mdi:battery-high
            icon_color: green
            entity: sensor.solarflow_2400_ac_available_kwh
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.hw_p1_vermogen') }} W"
            secondary: Netstroom, P1 (kan negatief zijn bij export)
            icon: mdi:transmission-tower
            icon_color: orange
            entity: sensor.hw_p1_vermogen
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-template-card
            primary: >-
              {{ states('sensor.woonkamer_energy_management_system_huishoudverbruik_werkelijk') }} W
            secondary: Werkelijk huishoudverbruik
            icon: mdi:home-lightning-bolt-outline
            icon_color: amber
            entity: sensor.woonkamer_energy_management_system_huishoudverbruik_werkelijk
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-template-card
            primary: >-
              {{
              states('sensor.woonkamer_energy_management_system_current_price_used_by_integration')
              }} €/kWh
            secondary: Huidige prijs
            icon: mdi:cash-sync
            icon_color: blue
            entity: >-
              sensor.woonkamer_energy_management_system_current_price_used_by_integration
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-template-card
            primary: >-
              {% set s = 'sensor.woonkamer_energy_management_system_accu_koeling' %}{% set accu = state_attr(s, 'accu_c') %}{{ (accu ~ ' °C') if accu is not none else states(s) }}
            secondary: >-
              {% set s = 'sensor.woonkamer_energy_management_system_accu_koeling' %}{% set st = states(s) %}Accu-koeling: {{ st }}
            icon: mdi:fan
            icon_color: >-
              {% set st = states('sensor.woonkamer_energy_management_system_accu_koeling') %}{% if st == 'koelt' %}blue{% elif st == 'uit' %}grey{% else %}orange{% endif %}
            entity: sensor.woonkamer_energy_management_system_accu_koeling
            tap_action:
              action: more-info
            grid_options:
              columns: 6
              rows: 1

      - type: grid
        cards:
          - type: heading
            heading: Modus & besluit
            grid_options:
              columns: 12
              rows: 1
          - type: custom:mushroom-template-card
            primary: "{{ states('select.zendure_manager_operation') }}"
            secondary: Werkelijke modus (Zendure — alleen weergave)
            icon: mdi:battery-sync
            icon_color: cyan
            entity: select.zendure_manager_operation
            tap_action:
              action: none
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-template-card
            primary: >-
              {{
              states('sensor.energy_management_system_expected_operation_mode')
              }}
            secondary: Verwachte modus (logica)
            icon: mdi:brain
            icon_color: purple
            entity: sensor.energy_management_system_expected_operation_mode
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-template-card
            primary: >-
              {{
              states('sensor.energy_management_system_effective_expensive_quarters')
              }} kwartieren
            secondary: Boven prijsdrempel (hele dag, capaciteit-begrensd)
            icon: mdi:chart-bell-curve
            icon_color: red
            entity: sensor.energy_management_system_effective_expensive_quarters
            grid_options:
              columns: 6
              rows: 1
          - type: markdown
            content: >
              ℹ️ Telt de **hele kalenderdag** (ook uren die al voorbij zijn),
              maar wél begrensd op wat de accu fysiek zou kunnen verkopen
              (totale capaciteit min de hardware-min.-SoC, gedeeld door het
              ontlaadvermogen) — mits `battery_total_capacity_sensor_entity`
              en `battery_min_soc_number_entity` zijn geconfigureerd. Zonder
              die twee: ongebreidelde ruwe telling, zoals voorheen. Kan
              hoger uitvallen dan het aantal "manual"-kwartieren dat je nog
              in het schema (Geschiedenis-tabblad) ziet, wat alleen de
              **resterende** tijd toont.
            grid_options:
              columns: 12
              rows: auto
          - type: custom:mushroom-template-card
            primary: "{{ states('number.solaredge_i1_active_power_limit') }}%"
            secondary: Zonnepaneel-vermogenslimiet (bij negatieve prijs)
            icon: mdi:solar-power-variant
            icon_color: amber
            entity: number.solaredge_i1_active_power_limit
            tap_action:
              action: none
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-template-card
            primary: >-
              {% set source = state_attr('sensor.woonkamer_energy_management_system_explanation', 'heavy_load_source') %}
              {{ {'vaatwasser': 'Vaatwasser', 'wasmachine': 'Wasmachine', 'quooker': 'Quooker', 'airco': 'Airco', 'oven': 'Oven', 'kookplaat': 'Kookplaat'}.get(source, 'Geen') }}
            secondary: Grootverbruiker bevestigd actief (omzeilt mediaan-vertraging)
            icon: >-
              {{ 'mdi:lightning-bolt' if
              state_attr('sensor.woonkamer_energy_management_system_explanation', 'heavy_load_source')
              else 'mdi:lightning-bolt-outline' }}
            icon_color: >-
              {{ 'orange' if
              state_attr('sensor.woonkamer_energy_management_system_explanation', 'heavy_load_source')
              else 'grey' }}
            entity: sensor.woonkamer_energy_management_system_explanation
            tap_action:
              action: none
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 1

      - type: grid
        cards:
          - type: heading
            heading: Besturing
            grid_options:
              columns: 12
              rows: 1
          - type: custom:mushroom-entity-card
            entity: switch.energy_management_system_force_manual
            name: Force manual
            icon: mdi:hand-back-right
            grid_options:
              columns: 4
              rows: 1
          - type: custom:mushroom-entity-card
            entity: switch.energy_management_system_learning_only_no_control
            name: Learning only
            icon: mdi:school-outline
            grid_options:
              columns: 4
              rows: 1
          - type: custom:mushroom-entity-card
            entity: switch.woonkamer_energy_management_system_vacation_mode
            name: Vakantiemodus
            icon: mdi:bag-suitcase-outline
            grid_options:
              columns: 4
              rows: 1
          - type: custom:mushroom-entity-card
            entity: button.woonkamer_energy_management_system_test_notificatie_versturen
            name: Test notificatie
            icon: mdi:bell-ring-outline
            grid_options:
              columns: 4
              rows: 1
          - type: custom:mushroom-entity-card
            entity: switch.woonkamer_energy_management_system_steelstofzuiger_overrule
            name: Steelstofzuiger overrule
            icon: mdi:hand-back-right-outline
            grid_options:
              columns: 4
              rows: 1
          - type: custom:mushroom-entity-card
            entity: switch.woonkamer_energy_management_system_fietsladers_overrule
            name: Fietsladers overrule
            icon: mdi:hand-back-right-outline
            grid_options:
              columns: 4
              rows: 1
          - type: custom:mushroom-entity-card
            entity: switch.woonkamer_energy_management_system_vaatwasser_wasmachine_meldingen
            name: Vaatwasser/wasmachine-meldingen
            icon: mdi:bell-outline
            grid_options:
              columns: 4
              rows: 1

      - type: grid
        cards:
          - type: heading
            heading: Kernbeslissing (detail)
            grid_options:
              columns: 12
              rows: 1
          - type: entities
            entities:
              - entity: sensor.energy_management_system_last_decision_reason
                name: Reden laatste beslissing
              - entity: sensor.energy_management_system_simulated_action
                name: Gesimuleerde actie (bij learning only)
              - entity: sensor.energy_management_system_cheapest_block_start
                name: Start goedkoopste blok
              - entity: sensor.energy_management_system_discharge_window_start
                name: Start ontlaadvenster
              - entity: sensor.energy_management_system_energy_bridge_check
                name: Energie-check (genoeg om te overbruggen?)
              - entity: sensor.energy_management_system_battery_protection
                name: Accu-bescherming (toegepast ontlaadvermogen)
              - entity: sensor.woonkamer_energy_management_system_steelstofzuiger_status
                name: Steelstofzuiger status
              - entity: sensor.woonkamer_energy_management_system_sensor_health_score
                name: Sensor-gezondheidsscore (energiebalans-check)
              - entity: sensor.woonkamer_energy_management_system_sluipverbruik_detectie
                name: Sluipverbruik-detectie

      - type: grid
        cards:
          - type: heading
            heading: Advies-modules (detail, adviserend)
            grid_options:
              columns: 12
              rows: 1
          - type: entities
            entities:
              - entity: sensor.woonkamer_energy_management_system_weather_ensemble_bewolkingsgraad
                name: Weather ensemble (bewolkingsgraad)
              - entity: sensor.woonkamer_energy_management_system_mpc_advies_prijsarbitrage_plan
                name: MPC advies (prijsarbitrage-plan)
              - entity: sensor.woonkamer_energy_management_system_monte_carlo_risico_tekortkans
                name: Monte Carlo risico (tekortkans)
              - entity: sensor.woonkamer_energy_management_system_kalman_filtering_soc_pv_verbruik
                name: Kalman filtering (SoC/PV/verbruik)
              - entity: sensor.woonkamer_energy_management_system_digital_twin_gesimuleerde_soc_winst
                name: Digital Twin (gesimuleerde SoC/winst)
              - entity: sensor.woonkamer_energy_management_system_advies_gereedheid_8_modules
                name: Advies-gereedheid (8 adviesmodules)

  - title: Accumodules
    path: accumodules
    cards:
      - type: custom:mushroom-title-card
        title: Gezondheid per accumodule

      - type: markdown
        content: |
          {% set s = 'sensor.woonkamer_energy_management_system_accu_modulegezondheid' %}{% set mods = state_attr(s, 'modules') or [] %}{% if mods | length == 0 %}Nog geen accumodules geconfigureerd — vul de vijf lijstvelden in bij Configureren (volgorde bepaalt het modulenummer).{% else %}| Module | Celdelta | Temp | SoC | Vermogen | Dagen |
          |---|---|---|---|---|---|
          {% for m in mods %}| **{{ m.get('module') }}** | {{ '%.3f V' | format(m.get('cel_delta_v')) if m.get('cel_delta_v') is not none else '—' }} | {{ '%.1f °C' | format(m.get('temperatuur_c')) if m.get('temperatuur_c') is not none else '—' }} | {{ '%.0f%%' | format(m.get('soc_percent')) if m.get('soc_percent') is not none else '—' }} | {{ '%.0f W' | format(m.get('vermogen_w')) if m.get('vermogen_w') is not none else '—' }} | {{ m.get('dagen_geleerd') }} |
          {% endfor %}{% endif %}

      - type: markdown
        title: Afwijking t.o.v. de andere modules
        content: |
          {% set s = 'sensor.woonkamer_energy_management_system_accu_modulegezondheid' %}{% set mods = state_attr(s, 'modules') or [] %}{% if mods | length < 2 %}Minimaal twee modules nodig om onderling te vergelijken.{% else %}Elke module tegen het gemiddelde van de ánderen. Rond nul is goed; een waarde die over weken oploopt is het signaal.

          | Module | Celdelta | Temperatuur | SoC |
          |---|---|---|---|
          {% for m in mods %}| **{{ m.get('module') }}** | {{ '%+.3f V' | format(m.get('cel_delta_afwijking_v')) if m.get('cel_delta_afwijking_v') is not none else '—' }} | {{ '%+.1f °C' | format(m.get('temperatuur_afwijking_c')) if m.get('temperatuur_afwijking_c') is not none else '—' }} | {{ '%+.1f%%' | format(m.get('soc_afwijking_percent')) if m.get('soc_afwijking_percent') is not none else '—' }} |
          {% endfor %}{% endif %}

      - type: markdown
        title: Onderlinge spreiding
        content: |
          {% set sp = state_attr('sensor.woonkamer_energy_management_system_accu_modulegezondheid', 'spreiding') or {} %}| Grootheid | Hoogste − laagste |
          |---|---|
          | Celspanningsverschil | {{ '%.3f V' | format(sp.get('cel_delta_v')) if sp.get('cel_delta_v') is not none else '—' }} |
          | Celtemperatuur | {{ '%.1f °C' | format(sp.get('temperatuur_c')) if sp.get('temperatuur_c') is not none else '—' }} |
          | SoC | {{ '%.1f%%' | format(sp.get('soc_percent')) if sp.get('soc_percent') is not none else '—' }} |

      - type: markdown
        title: Bevindingen
        content: |
          {% set s = 'sensor.woonkamer_energy_management_system_accu_modulegezondheid' %}{% set mods = state_attr(s, 'modules') or [] %}{% set ns = namespace(gevonden=false) %}{% for m in mods %}{% if m.get('waarschuwingen') or m.get('drift_op') %}{% set ns.gevonden = true %}
          - **Module {{ m.get('module') }}**: {{ m.get('waarschuwingen') | join(', ') }}{% if m.get('drift_op') %}{% if m.get('waarschuwingen') %}; {% endif %}aanhoudende drift op {{ m.get('drift_op') | join(', ') }}{% endif %}
          {% endif %}{% endfor %}{% if not ns.gevonden %}Geen bijzonderheden — alle modules lopen in de pas.{% endif %}

      - type: markdown
        title: Hoe dit werkt
        content: >-
          {{ state_attr('sensor.woonkamer_energy_management_system_accu_modulegezondheid', 'note') }}

  - title: Financieel
    path: financieel
    cards:
      - type: custom:mushroom-title-card
        title: Financieel

      - type: markdown
        content: |
          {% set s = 'sensor.woonkamer_energy_management_system_battery_savings_cost_basis_model' %}{% set actief = state_attr(s, 'salderen_actief') %}{% set tw = state_attr(s, 'teruglever_waarde_eur_per_kwh') %}{% set pv = state_attr(s, 'geladen_uit_pv_kwh') %}{% set net = state_attr(s, 'geladen_uit_net_kwh') %}{% set exp = state_attr(s, 'ontladen_naar_net_kwh') %}{% set derf = state_attr(s, 'gederfde_teruglevering_eur') %}### {{ '🔁 Saldering actief' if actief else '⚡ Saldering beëindigd' }}
          | — | — |
          |---|---|
          | 💶 **Terugleverwaarde** | {{ '€%.4f/kWh' | format(tw) if tw is not none else 'onbekend' }} |
          | ☀️ **Geladen uit PV** | {{ '%.1f kWh' | format(pv) if pv is not none else '—' }} |
          | 🔌 **Geladen uit net** | {{ '%.1f kWh' | format(net) if net is not none else '—' }} |
          | ↩️ **Ontladen naar net** | {{ '%.1f kWh' | format(exp) if exp is not none else '—' }} |
          | 📉 **Gederfde teruglevering** | {{ '€%.2f' | format(derf) if derf is not none else '—' }} |

          {% if actief %}Zolang salderen geldt is teruglevering evenveel waard als inkoop. PV in de accu stoppen voor eigen gebruik levert dan niets extra op — de winst komt puur uit het prijsverschil tussen goedkope en dure kwartieren.{% else %}Saldering is beëindigd: teruglevering levert nu veel minder op dan inkoop kost. Elke kWh PV die je zelf verbruikt in plaats van teruglevert is nu het verschil waard — opslaan is daardoor aanzienlijk aantrekkelijker geworden dan voorheen.{% endif %}

      - type: custom:mushroom-template-card
        primary: >-
          € {{
          states('sensor.woonkamer_energy_management_system_battery_savings_cost_basis_model')
          }}
        secondary: >-
          Accubesparing (kostprijs-model) — huidige kostprijs: € {{
          state_attr('sensor.woonkamer_energy_management_system_battery_savings_cost_basis_model',
          'cost_basis_eur_per_kwh') }}/kWh
        icon: mdi:piggy-bank-outline
        icon_color: >-
          {{ 'green' if
          states('sensor.woonkamer_energy_management_system_battery_savings_cost_basis_model')
          | float(0) >= 0 else 'red' }}
        entity: >-
          sensor.woonkamer_energy_management_system_battery_savings_cost_basis_model
        tap_action:
          action: more-info

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: >-
              € {{
              states('sensor.woonkamer_energy_management_system_discharge_value_expensive_quarters')
              }}
            secondary: Waarde ontladen (totaal)
            icon: mdi:cash-plus
            icon_color: green
            entity: >-
              sensor.woonkamer_energy_management_system_discharge_value_expensive_quarters
          - type: custom:mushroom-template-card
            primary: >-
              € {{
              states('sensor.woonkamer_energy_management_system_charge_cost_grid_charging')
              }}
            secondary: Netlaadkosten (totaal)
            icon: mdi:cash-minus
            icon_color: red
            entity: >-
              sensor.woonkamer_energy_management_system_charge_cost_grid_charging

      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: "€ {{ states('sensor.ems_ontlaadwaarde_vandaag') }}"
            secondary: Vandaag
            icon: mdi:calendar-today
            icon_color: green
            entity: sensor.ems_ontlaadwaarde_vandaag
          - type: custom:mushroom-template-card
            primary: "€ {{ states('sensor.ems_ontlaadwaarde_deze_week') }}"
            secondary: Deze week
            icon: mdi:calendar-week
            icon_color: green
            entity: sensor.ems_ontlaadwaarde_deze_week
          - type: custom:mushroom-template-card
            primary: "€ {{ states('sensor.ems_ontlaadwaarde_deze_maand') }}"
            secondary: Deze maand
            icon: mdi:calendar-month
            icon_color: green
            entity: sensor.ems_ontlaadwaarde_deze_maand
          - type: custom:mushroom-template-card
            primary: "€ {{ states('sensor.ems_netlaadkosten_vandaag') }}"
            secondary: Vandaag
            icon: mdi:calendar-today
            icon_color: red
            entity: sensor.ems_netlaadkosten_vandaag
          - type: custom:mushroom-template-card
            primary: "€ {{ states('sensor.ems_netlaadkosten_deze_week') }}"
            secondary: Deze week
            icon: mdi:calendar-week
            icon_color: red
            entity: sensor.ems_netlaadkosten_deze_week
          - type: custom:mushroom-template-card
            primary: "€ {{ states('sensor.ems_netlaadkosten_deze_maand') }}"
            secondary: Deze maand
            icon: mdi:calendar-month
            icon_color: red
