              {{ (state_attr('button.woonkamer_energy_management_system_nilm_kandidaat_1_negeren', 'kandidaat_vermogen_w') | round(0) | string ~
              ' W — tik om te negeren') if state_attr('button.woonkamer_energy_management_system_nilm_kandidaat_1_negeren',
              'kandidaat_vermogen_w') is not none else 'Tik om te negeren' }}
            icon: mdi:close-circle-outline
