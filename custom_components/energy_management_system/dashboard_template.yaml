- title: PV / zon
  path: detail-zon
  subview: true
  type: sections
  max_columns: 1
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: PV / zon
      subtitle: Opwek, installatieprofiel en voorspelnauwkeurigheid
    - type: custom:mushroom-entity-card
      entity: sensor.woonkamer_energy_management_system_pv_installatieprofiel
      name: PV-installatieprofiel
      tap_action:
        action: navigate
        navigation_path: /energy-management-system/detail-zon
      icon: mdi:solar-panel
    - type: custom:mushroom-template-card
      primary: '{% set v = states(''sensor.woonkamer_energy_management_system_pv_hourly_forecast_bias'') %}{{ v if v not in [''unknown'',''unavailable'',''''] else ''buiten daglichturen'' }}'
      secondary: '{% set p = state_attr(''sensor.woonkamer_energy_management_system_pv_hourly_forecast_bias'', ''profile_confident'') or {} %}PV-voorspelling bias{% if p | length > 0 %} · {{ p | length }} uren geleerd{% endif %}'
      icon: mdi:weather-partly-cloudy
      entity: sensor.woonkamer_energy_management_system_pv_hourly_forecast_bias
      tap_action:
        action: more-info
    - type: custom:mushroom-template-card
      primary: '{% set z = state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''zon_vandaag'') or {} %}{{ z.get(''opgewekt_kwh'', ''—'') }} kWh opgewekt, voorspeld {{ z.get(''voorspeld_kwh'', ''—'') }} kWh'
      secondary: '{% set z = state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''zon_vandaag'') or {} %}{{ z.get(''herkomst'', '''') }}{% if z.get(''afwijking_procent'') is not none %} · nu {{ z.afwijking_procent }}% ten opzichte van de voorspelling{% endif %}'
      multiline_secondary: true
      icon: mdi:sun-clock
      icon_color: amber
      entity: sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling
      tap_action:
        action: more-info
      grid_options:
        columns: 12
        rows: auto
    - type: markdown
      title: Hoe goed is de PV-voorspelling?
      content: '{% set q = state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''pv_voorspelkwaliteit'') or {} %}{% if not q.get(''beschikbaar'') %}{{ q.get(''reden'', ''Nog geen gegevens.'') }}{% else %}Over **{{ q.dagen }} voltooide dagen**:


        | Maat | Waarde | Wat het zegt |

        |---|---|---|

        | Bias | {{ q.bias_procent }}% | structureel te hoog of te laag |

        | Gemiddelde fout | {{ q.gemiddelde_fout_procent }}% | hoe ver een dag er gemiddeld naast zit |

        | Mediaan fout | {{ q.mediaan_fout_procent }}% | de typische dag |

        | Spreiding | {{ q.spreiding_procent }}% | hoe wisselvallig |

        | Beste dag | {{ q.beste_dag_procent }}% | |

        | Slechtste dag | {{ q.slechtste_dag_procent }}% | |

        | Binnen 10% | {{ q.dagen_binnen_10_procent }} van {{ q.dagen }} | |

        | Binnen 20% | {{ q.dagen_binnen_20_procent }} van {{ q.dagen }} | |


        {{ q.duiding }}


        _Bias en fout zijn verschillende dingen: de bias zegt de RICHTING, de fout de GROOTTE. Corrigeer je de bias, dan blijft de spreiding over._{% endif %}'
      grid_options:
        columns: 12
        rows: auto
    - type: markdown
      title: Wordt de voorspelling gecorrigeerd?
      content: '{% set c = state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''pv_correctie'') or {} %}{% if not c.get(''actief'') %}Nog niets geleerd; de voorspelling wordt ongewijzigd gebruikt.{% else %}**Ja** — op drie niveaus, in deze volgorde:


        {% for stap in c.volgorde %}{{ loop.index }}. {{ stap }}

        {% endfor %}

        Er zijn **{{ c.uren_met_eigen_correctie }} uren** met een eigen geleerde correctie; voor de overige uren geldt het daggemiddelde van {{ c.daggemiddelde_bias_procent }}%.


        {% if c.sterkste_correctie %}De correctie verschilt sterk per uur: om {{ c.sterkste_correctie.uur }}:00 wordt de voorspelling met {{ c.sterkste_correctie.factor }} vermenigvuldigd, om {{ c.zwakste_correctie.uur }}:00 met {{ c.zwakste_correctie.factor }}. Eén daggemiddelde zou dat verschil wegpoetsen.{% endif %}


        _{{ c.toelichting }}_{% endif %}'
      grid_options:
        columns: 12
        rows: auto
