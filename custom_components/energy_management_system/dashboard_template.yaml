      title: Water
      subtitle: Verbruik en waterontharder
    - type: custom:mushroom-template-card
      primary: Waterverbruik vandaag
      secondary: '{% set s = (state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''samenvattingen'') or {}).get(''water'') or {} %}{{ s.get(''zin'', ''Nog geen gegevens.'') }}'
      multiline_secondary: true
      icon: mdi:information-outline
      icon_color: '{% set n = ((state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''samenvattingen'') or {}).get(''water'') or {}).get(''niveau'') %}{{ ''red'' if n == ''onbetrouwbaar'' else (''green'' if n == ''betrouwbaar'' else ''orange'') }}'
      entity: sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling
      tap_action:
        action: navigate
        navigation_path: /energy-management-system/detail-water
    - type: markdown
      title: Waterontharder
      content: '{% set r = state_attr(''sensor.woonkamer_energy_management_system_waterverbruik'', ''waterontharder_laatste_regeneratie'') %}{% if r %}Laatste regeneratie: **{{ as_timestamp(r) | timestamp_custom(''%-d %b %H:%M'') }}** ({{ relative_time(as_datetime(r)) }} geleden).{% else %}Nog geen regeneratie waargenomen.{% endif %}


        {% set s = state_attr(''sensor.woonkamer_energy_management_system_waterverbruik'', ''recente_gebruiksmomenten'') or [] %}{% set ns = namespace(n=0) %}{% for x in s %}{%- if x.waarschijnlijk_waterontharder %}{% set ns.n = ns.n + 1 %}{%- endif %}{%- endfor %}{{ ns.n }} van de laatste {{ s | length }} gebruiksmomenten was een regeneratie.


        _Herkend aan een nachtelijke sessie van minstens 10 liter (de volumedrempel uit v1.9.2 voorkomt dat een kleine tap onterecht meetelt)._

        '
      grid_options:
        columns: 12
        rows: auto
    - type: markdown
      title: Waterverbruik vandaag
      content: '{% set alles = state_attr(''sensor.woonkamer_energy_management_system_waterverbruik'', ''recente_gebruiksmomenten'') or [] %}{% set dag = now().strftime(''%Y-%m-%d'') %}{% set ns = namespace(v=[]) %}{% for s in alles %}{%- if s.gestart and dag in s.gestart %}{%- set ns.v = ns.v + [s] %}{%- endif %}{%- endfor %}{% if ns.v | length == 0 %}Nog geen gebruiksmomenten vandaag.{% else %}| Gestart | Duur | Volume |

        |---|---|---|

        {% for s in ns.v %}| {{ as_timestamp(s.gestart) | timestamp_custom(''%H:%M'') }} | {{ s.duur_minuten }} min | {{ s.liter }} L |

        {% endfor %}{% endif %}

        '
    - type: markdown
      title: Waar ging het water heen?
      content: '{% set s = state_attr(''sensor.woonkamer_energy_management_system_waterverbruik'', ''recente_gebruiksmomenten'') or [] %}{% set dag = now().strftime(''%Y-%m-%d'') %}{% set ns = namespace(v=[]) %}{% for x in s %}{%- if x.gestart and dag in x.gestart %}{% set ns.v = ns.v + [x] %}{%- endif %}{%- endfor %}{% if ns.v | length == 0 %}Nog geen gebruiksmomenten vandaag.{% else %}| Tijd | Liter | Bron | Zekerheid |

        |---|---|---|---|

        {% for x in ns.v %}| {{ as_timestamp(x.gestart) | timestamp_custom(''%H:%M'') }} | {{ x.liter }} L | {{ x.bron or ''?'' }} | {{ x.zekerheid or '''' }} |

        {% endfor %}{% endif %}


        **Hoe dit werkt.** Draait de vaatwasser of wasmachine, dan gaat het water daarheen. Maakt de CV-ketel warm water, dan is het douchen (langer dan 3 minuten) of handen wassen. Is de Quooker actief, dan is het de keuken. Staat er niets aan, dan blijft het volumepatroon over - een wc-spoeling is opvallend constant.


        _Klopt een toewijzing niet? Roep de actie `confirm_water_source` aan met de juiste bron. Na een paar bevestigingen herkent de integratie jouw eigen patroon in plaats van een vuistregel._'
      grid_options:
        columns: 12
        rows: auto
- title: Klimaat
  path: detail-klimaat
  subview: true
  type: sections
  max_columns: 1
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: Klimaat
      subtitle: Woonkamertemperatuur en airco-verwachting
    - type: custom:mushroom-template-card
      primary: Klimaatmodel
      secondary: '{% set s = (state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''samenvattingen'') or {}).get(''klimaat'') or {} %}{{ s.get(''zin'', ''Nog geen gegevens.'') }}'
      multiline_secondary: true
      icon: mdi:information-outline
      icon_color: '{% set n = ((state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''samenvattingen'') or {}).get(''klimaat'') or {}).get(''niveau'') %}{{ ''red'' if n == ''onbetrouwbaar'' else (''green'' if n == ''betrouwbaar'' else ''orange'') }}'
      entity: sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling
      tap_action:
        action: navigate
        navigation_path: /energy-management-system/detail-klimaat
    - type: markdown
      title: Woonkamertemperatuur per uur
      content: '{% set t = state_attr(''sensor.woonkamer_energy_management_system_klimaat_projectie_woonkamertemperatuur'', ''traject'') or [] %}{% if t | length == 0 %}Nog geen projectie beschikbaar - de integratie leert per combinatie van buitentemperatuur, rolluikstand en airco.{% else %}| Uur | Snel | Betrouwbaar | Buiten | Basis | Metingen |

        |---|---|---|---|---|---|

        {% for u in t %}| {{ as_timestamp(u.get(''tijd'')) | timestamp_custom(''%H:%M'') if u.get(''tijd'') else ''?'' }} | {{ u.get(''kort_termijn_temp_c'') if u.get(''kort_termijn_temp_c'') is not none else ''—'' }} °C | {{ u.get(''betrouwbaar_temp_c'') if u.get(''betrouwbaar_temp_c'') is not none else ''—'' }} °C | {{ u.get(''buitentemp_voorspeld_c'') if u.get(''buitentemp_voorspeld_c'') is not none else ''—'' }} °C | {{ u.get(''basis'') or ''—'' }} | {{ u.get(''aantal_metingen'') if u.get(''aantal_metingen'') is not none else ''—'' }} |

        {% endfor %}{% endif %}


        **Snel** valt terug op naburige situaties zodra de exacte combinatie te dun bezet is; **Betrouwbaar** komt pas bij genoeg metingen in precies die situatie.


        _Staat de kolom Betrouwbaar op alle uren gelijk, dan is er voor die situaties nog geen geleerde verandersnelheid en wordt bewust de huidige temperatuur aangehouden - liever geen verandering voorspellen dan een verkeerde._'
      grid_options:
        columns: 12
        rows: auto
    - type: custom:mushroom-template-card
      primary: '{% set v = states(''sensor.woonkamer_energy_management_system_airco_verwachting_woonkamertemperatuur'') %}{{ v ~ ''% kans dat de airco aangaat'' if v not in [''unknown'',''unavailable'',''''] else ''nog niet genoeg waarnemingen'' }}'
      secondary: '{% set n = state_attr(''sensor.woonkamer_energy_management_system_airco_verwachting_woonkamertemperatuur'', ''aantal_metingen_deze_bucket'') %}{% set b = state_attr(''sensor.woonkamer_energy_management_system_airco_verwachting_woonkamertemperatuur'', ''huidige_bucket'') %}Binnen 1 uur, bij {{ b }} °C · geleerd uit {{ n or 0 }} waarnemingen'
      multiline_secondary: true
      icon: mdi:air-conditioner
      icon_color: '{% set v = states(''sensor.woonkamer_energy_management_system_airco_verwachting_woonkamertemperatuur'') | float(-1) %}{{ ''red'' if v >= 60 else (''orange'' if v >= 25 else ''green'') }}'
      entity: sensor.woonkamer_energy_management_system_airco_verwachting_woonkamertemperatuur
      tap_action:
        action: more-info
      grid_options:
        columns: 12
        rows: auto
    - type: markdown
      title: Hoe de airco-verwachting werkt
      content: 'Elke temperatuurmeting van de woonkamer gaat in een bin van 1 °C en krijgt een uur de tijd. Zet je de airco in dat uur aan, dan telt die waarneming als **ja** voor die bin.


        Zo leert de integratie van jouw gedrag: bij welke temperatuur grijp je in? Per bin worden de laatste 20 waarnemingen bewaard, zodat het meebeweegt met het seizoen.


        {% set h = state_attr(''sensor.woonkamer_energy_management_system_airco_verwachting_woonkamertemperatuur'', ''geleerde_buckets'') or {} %}{% if h %}| Temperatuur | Kans | Richting | Waarnemingen |

        |---|---|---|---|

        {% for b, g in h.items() %}| {{ b }} °C | {{ g.probability_percent }}% | {{ g.richting or ''—'' }} | {{ g.sample_count }} |

        {% endfor %}{% else %}_Nog geen bins met genoeg waarnemingen._{% endif %}


        _Dit werkt het hele jaar: de bins zijn richtingsneutraal en zowel verwarmen als koelen telt als ''aan''. Bij 18 °C leert hij dus wanneer je gaat stoken, bij 26 °C wanneer je gaat koelen - vandaar de kolom Richting, want dat zijn tegengestelde acties met een tegengesteld gevolg voor je verbruik._'
      grid_options:
        columns: 12
        rows: auto
