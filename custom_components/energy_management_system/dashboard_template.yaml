              - entity: sensor.woonkamer_energy_management_system_nilm_bevestigde_apparaten
                name: NILM bevestigde apparaten (drift-detectie)

      - type: markdown
        title: Bevestigde apparaten — verbruik en trend
        content: |
          {% set tabel = state_attr('sensor.woonkamer_energy_management_system_nilm_bevestigde_apparaten', 'tabel') or [] %}
          {% if tabel | length == 0 %}
          Nog geen apparaten bevestigd.
          {% else %}
          {% for rij in tabel %}
          - **{{ rij.naam }}** — {{ (rij.huidig_vermogen_w | round(0) | string ~ ' W') if rij.huidig_vermogen_w is not none else '—' }} — {{ rij.trend }}
          {% endfor %}
          {% endif %}

      - type: grid
        columns: 1
        square: false
        cards:
          - type: markdown
            content: >-
              Toont zelf welke kandidaat er nu klaarstaat (naam +
              huidig vermogen) — leeg als er niets meer te beoordelen
              is. ✅ = bevestigen (start drift-detectie), ❌ = negeren
              (nooit meer voorgesteld). Zodra je deze kandidaat
              beoordeelt, verschijnt de volgende automatisch.
