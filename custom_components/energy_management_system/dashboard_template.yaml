        columns: 1
        square: false
        cards:
          - type: heading
            heading: NILM — automatisch ontdekte apparaten
            grid_options:
              columns: 12
              rows: 1
          - type: entities
            grid_options:
              columns: 12
              rows: 2
            entities:
              - entity: sensor.woonkamer_energy_management_system_nilm_onbevestigde_kandidaten
