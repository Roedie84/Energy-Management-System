      content: '{{ state_attr(''sensor.woonkamer_energy_management_system_wat_doet_de_integratie_nu'', ''verhaal'') or ''Nog geen data verwerkt.'' }}'
    - type: markdown
      content: '{% set ontbrekend = state_attr(''sensor.woonkamer_energy_management_system_optionele_functies_nog_niet_geconfigureerd'', ''ontbrekend'') or [] %} {% if ontbrekend | length > 0 %} **💡 {{ ontbrekend | length }} optionele functie(s) nog niet geconfigureerd:**

        {% for item in ontbrekend %} - **{{ item.naam }}** — ontgrendelt: {{ item.ontgrendelt }} {% endfor %} {% endif %}'
    - type: history-graph
      title: Verwachte vs. werkelijke modus over tijd
      hours_to_show: 48
      entities:
      - entity: sensor.energy_management_system_expected_operation_mode
        name: Verwacht
      - entity: select.zendure_manager_operation
        name: Werkelijk
    - type: history-graph
      title: SoC & verbruik over tijd
      hours_to_show: 48
      entities:
      - entity: sensor.solarflow_2400_ac_electric_level
        name: SoC (%)
      - entity: sensor.solarflow_2400_ac_available_kwh
        name: Beschikbare kWh
      - entity: sensor.hw_p1_vermogen
        name: Verbruik (W)
    - type: history-graph
      title: Verbruiksprofiel (hele dag) & voorspelling-afwijking over tijd
      hours_to_show: 168
      entities:
      - entity: sensor.woonkamer_energy_management_system_hourly_consumption_profile
        name: Verbruiksprofiel (huidig uur, W)
      - entity: sensor.energy_management_system_pv_forecast_accuracy
        name: PV-voorspelling afwijking (%)
- title: Aanwezigheid
  path: detail-aanwezigheid
  subview: true
  type: sections
  max_columns: 1
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: Aanwezigheid
      subtitle: Uit de bewegingssensoren binnenshuis
    - type: markdown
      title: Is er iemand thuis?
      content: '{% set p = state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''aanwezigheid'') or {} %}{% if not p.get(''beschikbaar'') %}{{ p.get(''reden'', ''Nog geen gegevens.'') }}{% else %}Op dit moment: **{{ p.nu or ''onbekend'' }}**{% if p.minuten_zonder_beweging is not none %} ({{ p.minuten_zonder_beweging }} minuten zonder beweging){% endif %}. Gebaseerd op {{ p.sensoren }} sensor(en).


        {% if p.halfuren_geleerd > 0 %}Er zijn **{{ p.halfuren_geleerd }} halfuren** van de week geleerd; gemiddeld is er {{ p.typisch_thuis_percentage }}% van de tijd iemand thuis.{% else %}Nog te weinig waarnemingen voor een weekpatroon.{% endif %}


        {% if p.lichten_ingesteld %}**Lampen tellen mee:** {{ p.lichten_ingesteld }} gekozen{% if p.licht_aan %}, nu brandt **{{ p.licht_aan }}**{% endif %}. Tijdens de vakantiestand tellen ze niet mee - dan zet de automatisering ze juist aan.


        {% endif %}{% if p.slaapsensor_ingesteld %}**Slapen wordt herkend.** Is de slaapsensor de laatste beweging ''s avonds, dan geldt de stilte erna als slapen en niet als afwezigheid.{% if p.bedtijden_geleerd > 0 %} Typische bedtijd: **{{ p.typische_bedtijd }}** (uit {{ p.bedtijden_geleerd }} waarnemingen).{% endif %}{% else %}_Geen slaapsensor ingesteld. Zonder die sensor telt een nacht als afwezigheid, terwijl ''niemand thuis'' en ''iedereen slaapt'' tegengestelde situaties zijn: bij afwezigheid mag alles uit, bij slapen moet de nachtreserve juist kloppen._{% endif %}


        _Er wordt per halfuur van de week bijgehouden hoe vaak er iemand thuis was. Werkdagen verschillen van het weekend, en ''s ochtends van ''s avonds. Alleen sensoren die je zelf hebt gekozen tellen mee: buitensensoren slaan aan op voorbijgangers._{% endif %}'
      grid_options:
        columns: 12
        rows: auto
    - type: markdown
      title: Welke sensor zag als laatste beweging?
      content: '{% set p = state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''aanwezigheid'') or {} %}{% set l = p.get(''laatst_gezien'') or [] %}{% if l | length == 0 %}Nog geen beweging waargenomen.{% else %}| Sensor | Laatst gezien | Geleden |

        |---|---|---|

        {% for r in l %}| {{ r.naam }} | {{ as_timestamp(r.tijd) | timestamp_custom(''%H:%M'') }} | {{ r.minuten_geleden }} min |

        {% endfor %}{% endif %}


        _De bovenste is de meest recente. Staat er een sensor bovenaan die je niet verwacht - een gang, de schuur - dan verklaart dat waarom het systeem ''thuis'' meldt terwijl er niemand is._


        **Verder:** [Tijdlijn - thuis, weg of slapend](/energy-management-system/detail-aanwezigheid-tijdlijn)'
      grid_options:
        columns: 12
        rows: auto
- title: Aanwezigheid-tijdlijn
  path: detail-aanwezigheid-tijdlijn
  subview: true
  type: sections
  max_columns: 1
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: Aanwezigheid-tijdlijn
      subtitle: Wat er wanneer stond, om achteraf te controleren
    - type: markdown
      title: Uren per dag
      content: '{% set p = state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''aanwezigheid'') or {} %}{% set d = p.get(''per_dag'') or [] %}{% if d | length == 0 %}Nog geen volledige dag vastgelegd.{% else %}| Dag | Thuis | Weg | Slaapt |

        |---|---|---|---|

        {% for r in d %}| {{ r.dag }} | {{ r.thuis_uur }} u | {{ r.weg_uur }} u | {{ r.slaapt_uur }} u |

        {% endfor %}{% endif %}


        _Klopt "8 uur weg" met de werkdag die je had? Zo niet, dan staat in de tijdlijn hieronder waar het misging. Blokken over middernacht tellen bij de juiste dag._'
      grid_options:
        columns: 12
        rows: auto
    - type: markdown
      title: Tijdlijn - thuis, weg of slapend
      content: '{% set p = state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''aanwezigheid'') or {} %}{% set t = p.get(''tijdlijn'') or [] %}{% if t | length == 0 %}Nog geen overgangen vastgelegd - die verschijnen zodra de staat voor het eerst omslaat.{% else %}| Dag | Van | Tot | Staat | Duur | Waarom |

        |---|---|---|---|---|---|

        {% for r in t %}| {{ r.dag }} | {{ r.van }} | {{ r.tot }} | {% if r.staat == ''thuis'' %}**thuis**{% elif r.staat == ''weg'' %}weg{% elif r.staat == ''slaapt'' %}_slaapt_{% else %}{{ r.staat }}{% endif %} | {{ r.duur }} | {{ r.aanleiding }} |

        {% endfor %}{% endif %}


        _Nieuwste bovenaan; er worden {{ (p.get(''tijdlijn'') or []) | length }} van de {{ p.get(''tijdlijn_totaal'', 0) }} bewaarde overgangen getoond. Alleen overgangen worden vastgelegd, niet elke meting. Blokjes korter dan vijf minuten tussen twee gelijke staten zijn samengevoegd - anders levert een enkele beweging ''s nachts drie regels op. De kolom "Waarom" is waar de controle mee begint: klopt de sensor die de omslag veroorzaakte?_'
      grid_options:
        columns: 12
        rows: auto
- title: Plantoetsing
  path: detail-plantoetsing
  subview: true
  type: sections
  max_columns: 1
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: Plantoetsing
      subtitle: Wat het plan beloofde, en wat het werd
    - type: markdown
      title: Wat er structureel opvalt
      content: '{% set p = state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''plantoetsing'') or {} %}{% if not p.get(''beschikbaar'') %}{{ p.get(''reden'', ''Nog niets getoetst.'') }}{% else %}| | |

        |---|---|

        | Dagen getoetst | {{ p.dagen }} |

        | Binnen de marge | {{ p.dagen_binnen_marge }} van {{ p.dagen }} |

        | Zon, mediane afwijking | {{ p.zon_afwijking_mediaan_procent }}% |

        | Opbrengst, mediane afwijking | {{ p.opbrengst_afwijking_mediaan_procent }}% |


        {{ p.structureel }}{% endif %}


        _Er wordt hier niets bijgestuurd; dit is een rapport. Een losse dag zegt weinig - een reeks wel._'
      grid_options:
        columns: 12
        rows: auto
    - type: markdown
      title: Per dag
      content: '{% set p = state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''plantoetsing'') or {} %}{% set d = p.get(''dagen_overzicht'') or [] %}{% if d | length == 0 %}Het eerste oordeel verschijnt na middernacht.{% else %}| Dag | Zon | Opbrengst | Laagste SoC | Oordeel |

        |---|---|---|---|---|

        {% for r in d %}| {{ r.datum }} | {{ r.zon.werkelijk_kwh }} / {{ r.zon.voorspeld_kwh }} kWh | € {{ r.opbrengst.werkelijk_eur }} / € {{ r.opbrengst.voorspeld_eur }} | {{ r.laagste_soc.werkelijk_procent }}% / {{ r.laagste_soc.voorspeld_procent }}% | {{ r.oordeel }} |

        {% endfor %}{% endif %}


        _Werkelijk / voorspeld. Het plan wordt elke ochtend om 08:00 vastgelegd en na middernacht getoetst._'
      grid_options:
        columns: 12
        rows: auto
- title: Proefstand
  path: detail-proefstand
  subview: true
  type: sections
  max_columns: 1
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: Proefstand
      subtitle: Rekent mee, stuurt niets
    - type: markdown
      title: Kandidaten
      content: '{% set p = state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''proefstand'') or {} %}{% set k = p.get(''kandidaten'') or [] %}{% for c in k %}### {{ c.naam }}

        {% if c.waarde %}**{{ c.waarde }}** — {{ c.status | replace(''_'', '' '') }}

        {{ c.get(''onderbouwing'', '''') }}

        {% else %}_Nog geen uitspraak._

        {% endif %}_{{ c.get(''betrouwbaarheid'', '''') }}_

        {% set o = c.get(''zou_hebben_opgeleverd'') or {} %}{% if o.get(''te_becijferen'') %}**Zou hebben opgeleverd: € {{ o.bedrag_per_dag_eur }} per dag (€ {{ o.bedrag_per_jaar_eur }} per jaar, over {{ o.dagen }} dag(en)).** {{ o.toelichting }}

        {% elif o.get(''reden'') %}_Nog niet in geld te vangen: {{ o.reden }}_

        {% endif %}{% if c.get(''zou_veranderen'') %}Zou raken: {{ c.zou_veranderen }}

        {% endif %}{% endfor %}


        _{{ p.get(''toelichting'', '''') }}_'
      grid_options:
        columns: 12
        rows: auto
- title: Weerbronnen
  path: detail-weer
  subview: true
  type: sections
  max_columns: 1
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: Weerbronnen
      subtitle: Wat elke bron meldt en hoe goed die klopt
    - type: markdown
      title: Welke weerbron telt mee?
      content: '{% set w = state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''weerbronnen'') or {} %}{% if not w %}Nog geen bronvergelijking beschikbaar.{% else %}| Bron | Bewolking | Klopt met de panelen |

        |---|---|---|

        {% for b, g in w.items() %}| {{ b.split(''.'')[-1] }} | {{ g.meting }}% | {{ g.betrouwbaarheid }}% |

        {% endfor %}

        {% if w.values() | selectattr(''gekozen'') | list | length > 0 %}De bronnen liepen te ver uiteen om te middelen, dus is de betrouwbaarste gebruikt.{% else %}De bronnen zitten dicht genoeg bij elkaar; het gemiddelde is gebruikt.{% endif %}


        {% set v = state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''weerbron_vergelijking'') or {} %}{% if v.get(''advies'') %}**Over langere tijd:** {{ v.advies }} Verschil {{ v.verschil_procentpunt }} procentpunt.{% endif %}{% endif %}


        _Middelen van twee bronnen die het fundamenteel oneens zijn, geeft een getal dat bij geen van beide past. Vanaf 25 procentpunt verschil wint daarom de bron die het aantoonbaar vaker bij het rechte eind heeft._'
      grid_options:
        columns: 12
        rows: auto
- title: Kwartierplanning
  path: detail-kwartier
  subview: true
  type: sections
  max_columns: 1
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: Kwartierplanning
      subtitle: Verwachte prijs, zon, modus en SoC per kwartier
    - type: markdown
      title: Wat de aansturing van plan is
      content: '{% set p = state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''kwartierplanning'') or [] %}{% if p | length == 0 %}Nog geen planning beschikbaar - hiervoor zijn prijsgegevens en een accustand nodig.{% else %}| Tijd | ct | Zon | Modus | SoC | Totaal |

        |---|---|---|---|---|---|

        {% for r in p %}{% set k = ''<span style="color:#e05252">'' if r.gewijzigd else '''' %}{% set s = ''</span>'' if r.gewijzigd else '''' %}| {{ k }}{{ r.dag }}{{ r.van }}{{ s }} | {{ k }}{{ r.prijs_ct }}{{ s }} | {{ k }}{{ r.zon_kwh }}{{ s }} | {{ k }}{{ r.modus }}{{ s }}{% if r.gewijzigd %} <sub>was {{ r.eerst_voorspeld }}</sub>{% endif %}{% if r.tekort %} **!**{% endif %} | {{ k }}{{ r.soc_procent }}%{{ s }} | {{ k }}{{ r.cumulatief_eur }}{{ s }} |

        {% endfor %}{% endif %}


        _**!** = de accu kan in dat kwartier niets meer leveren en het huis hangt aan het net. **Rood** = van plan veranderd sinds de eerste voorspelling. Voorbije kwartieren verdwijnen; er wordt gekeken zover als er prijzen zijn ({{ p | length }} kwartieren nu)._'
      grid_options:
        columns: 12
        rows: auto
- title: Planning-samenvatting
  path: detail-planning-samenvatting
  subview: true
  type: sections
  max_columns: 1
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: Planning-samenvatting
      subtitle: Verwachte opbrengst en of verkopen mag
    - type: markdown
      title: Verwachting over de hele planning
      content: '{% set s = state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''kwartier_samenvatting'') or {} %}{% if not s.get(''beschikbaar'') %}{{ s.get(''reden'',''Nog geen planning.'') }}{% else %}| | |

        |---|---|

        | Vooruit gekeken | {{ ((s.get(''kwartieren'', 0) / 4) | int) }} uur ({{ s.get(''kwartieren'', ''—'') }} kwartieren) |

        | Verwachte zon | {{ s.zon_kwh }} kWh |

        | Verwacht verbruik | {{ s.verbruik_kwh }} kWh |

        | Verwachte teruglevering | {{ s.export_kwh }} kWh |

        | Verwachte import | {{ s.import_kwh }} kWh |

        | **Verwachte opbrengst** | **{{ s.verwachte_opbrengst_eur }} EUR** |

        | Waarvan uit verkoop | {{ s.opbrengst_uit_verkoop_eur }} EUR ({{ s.verkoopkwartieren }} kwartieren) |

        | SoC laagste / hoogste | {{ s.laagste_soc_procent }}% / {{ s.hoogste_soc_procent }}% |

        | Waarvan bruikbaar, laagste | {{ s.laagste_bruikbaar_procent }}% |

        | SoC aan het eind | {{ s.eind_soc_procent }}% |

        | Kwartieren in goedkoop blok | {{ s.kwartieren_in_goedkoop_blok }} |

        | Gewijzigd sinds eerste plan | {{ s.gewijzigde_kwartieren }} |

        | **Kwartieren met tekort** | **{{ s.tekort_kwartieren }}**{% if s.tekort_kwartieren %} — {{ (s.get(''tekort_perioden'') or []) | join('', '') }}{% endif %} |

        | Harde ondergrens accu | {{ s.min_soc_procent_hard }}% |


        Modi: {% for m, n in s.modi.items() %}{{ m }} {{ n }}x{% if not loop.last %} · {% endif %}{% endfor %}{% endif %}


        _Kwartieren met tekort zijn het belangrijkste signaal: dan levert de accu niets meer en betaalt het huis de kale netprijs. Nul hoort de norm te zijn._


        _De SoC is de echte accustand, zoals in de Zendure-app; hij zakt nooit onder de harde ondergrens. "Bruikbaar" is wat daarvan nog te gebruiken valt - 0% daar betekent dat de accu op die ondergrens staat._


        _Let op de laagste SoC: die laat zien hoe diep de accu zakt._'
      grid_options:
        columns: 12
        rows: auto
    - type: markdown
      title: Mag de accu nu verkopen?
      content: '{% set v = state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''verkooptoets'') or {} %}{% if v.get(''mag_verkopen'') %}**Ja.** {{ v.reden }}{% else %}**Nee.** {{ v.get(''reden'', ''Nog niet beoordeeld.'') }}{% endif %}


        _De woning gaat voor. Op een zonarme dag (onder 5 kWh verwacht) wordt er niet verkocht: wat er is, is voor de woning, en wat ontbreekt wordt in het goedkope blok bijgeladen. Op andere dagen moet er na de verkoop nog genoeg overblijven om het huis te voeden tot dat blok, met marge - verkopen gaat op 1600 W terwijl het huis er 300 trekt, dus de accu leegt vijf keer zo snel als hij verbruikt wordt._'
      grid_options:
        columns: 12
        rows: auto
