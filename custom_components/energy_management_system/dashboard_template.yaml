      secondary: '{% set s = (state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''samenvattingen'') or {}).get(''water'') or {} %}{{ s.get(''zin'', ''Nog geen gegevens.'') }}'
      multiline_secondary: true
      icon: mdi:water
      icon_color: '{% set n = ((state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''samenvattingen'') or {}).get(''water'') or {}).get(''niveau'') %}{{ ''red'' if n == ''onbetrouwbaar'' else (''green'' if n == ''betrouwbaar'' else ''orange'') }}'
      entity: sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling
      tap_action:
        action: navigate
        navigation_path: /energy-management-system/detail-water
      grid_options:
        columns: 12
        rows: auto
    - type: custom:mushroom-template-card
      primary: Meetkwaliteit
      secondary: '{% set s = (state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''samenvattingen'') or {}).get(''kwaliteit'') or {} %}{{ s.get(''zin'', ''Nog geen gegevens.'') }}'
      multiline_secondary: true
      icon: mdi:shield-check-outline
      icon_color: '{% set n = ((state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''samenvattingen'') or {}).get(''kwaliteit'') or {}).get(''niveau'') %}{{ ''red'' if n == ''onbetrouwbaar'' else (''green'' if n == ''betrouwbaar'' else ''orange'') }}'
      entity: sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling
      tap_action:
        action: navigate
        navigation_path: /energy-management-system/detail-kwaliteit
      grid_options:
        columns: 12
        rows: auto
    - type: custom:mushroom-template-card
      primary: '{% set p = state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''nog_niet_bepaald'') or {} %}{{ p.get(''aantal_wachten'', ''—'') }} wachten, {{ p.get(''aantal_doen'', 0) }} te doen'
      secondary: Nog niet bepaald
      icon: mdi:progress-clock
      icon_color: '{% set p = state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''nog_niet_bepaald'') or {} %}{{ ''red'' if p.get(''aantal_doen'', 0) > 0 else (''grey'' if p.get(''aantal_wachten'', 0) > 0 else ''green'') }}'
      entity: sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling
      tap_action:
        action: navigate
        navigation_path: /energy-management-system/detail-kwaliteit
      grid_options:
        columns: 12
        rows: auto
    - type: heading
      heading: Meer bekijken
      grid_options:
        columns: 12
        rows: 1
    - type: custom:mushroom-template-card
      primary: Verloop
      secondary: Wat er gebeurde en waarom
