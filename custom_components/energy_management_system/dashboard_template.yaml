              target:
                entity_id: button.woonkamer_energy_management_system_nilm_kandidaat_1_negeren
            grid_options:
              columns: 12
              rows: 1

  - title: Advies
    path: advies
    icon: mdi:clipboard-check-outline
    cards:
      - type: custom:mushroom-title-card
        title: Advies-gereedheid
        subtitle: >-
          Acht modules zijn uitsluitend adviserend — geen ervan stuurt
          ooit een commando of weegt mee in een accubeslissing, ook niet
          als de status hieronder "klaar" toont. Gereedheid zegt iets
          over hoe betrouwbaar het cijfer zelf is, niet over of het
          veilig is om ergens op te sturen.

      - type: markdown
        title: Legenda
        content: |
          **Twee categorieën, niet één schaal:**

          - ✅ `klaar` / 🟡 `bijna_klaar` / ⏳ `onvoldoende_data` / ⚠️
            `kwaliteit_te_laag` / ⚪ `niet_geconfigureerd` — deze vijf
            statussen gelden voor modules met een échte
            data-volwassenheid-signaal (genoeg verzamelde metingen,
            of een aantoonbaar geconvergeerd filter).
          - 🔵 `structureel_beschikbaar` — geldt voor de drie modules
            zonder mechanisme dat een voorspelling ooit tegen de
            werkelijkheid legt (Weather Ensemble, MPC, Digital Twin).
            Werkt en berekent prima, maar "klaar" zou een niet-verdiende
            claim van bewezen nauwkeurigheid zijn.

      - type: markdown
        title: Alle acht modules
        content: |
          {% set modules = state_attr('sensor.woonkamer_energy_management_system_advies_gereedheid_8_modules', 'modules') or {} %}
          {% set namen = {
            'kirchhoff': 'Kirchhoff energiebalans-validatie',
            'sluipverbruik': 'CUSUM sluipverbruik-detectie',
            'weather_ensemble': 'Weather Ensemble',
            'mpc': 'MPC-adviesmotor',
            'monte_carlo': 'Monte Carlo',
            'kalman': 'Kalman filtering',
            'digital_twin': 'Digital Twin',
            'nilm': 'NILM apparaat-detectie'
          } %}
          {% set iconen = {
            'klaar': '✅',
            'bijna_klaar': '🟡',
            'onvoldoende_data': '⏳',
            'kwaliteit_te_laag': '⚠️',
            'niet_geconfigureerd': '⚪',
            'structureel_beschikbaar': '🔵'
          } %}

          | Module | Status | Reden |
          |---|---|---|
          {% for key, naam in namen.items() -%}
          {%- set m = modules.get(key, {}) -%}
          | {{ naam }} | {{ iconen.get(m.get('status'), '?') }} {{ m.get('status', 'onbekend') }} | {{ m.get('reden', '—') }} |
          {% endfor %}

      - type: entities
        title: Onderliggende sensoren (drill-down)
        entities:
          - entity: sensor.woonkamer_energy_management_system_sensor_health_score
            name: Kirchhoff — sensor-gezondheidsscore
          - entity: sensor.woonkamer_energy_management_system_sluipverbruik_detectie
            name: Sluipverbruik-detectie
          - entity: sensor.woonkamer_energy_management_system_weather_ensemble_bewolkingsgraad
            name: Weather Ensemble
          - entity: sensor.woonkamer_energy_management_system_mpc_advies_prijsarbitrage_plan
            name: MPC-adviesmotor
          - entity: sensor.woonkamer_energy_management_system_monte_carlo_risico_tekortkans
            name: Monte Carlo
          - entity: sensor.woonkamer_energy_management_system_kalman_filtering_soc_pv_verbruik
            name: Kalman filtering
          - entity: sensor.woonkamer_energy_management_system_digital_twin_gesimuleerde_soc_winst
            name: Digital Twin
          - entity: sensor.woonkamer_energy_management_system_nilm_bevestigde_apparaten
            name: NILM apparaat-detectie
          - entity: sensor.woonkamer_energy_management_system_advies_gereedheid_8_modules
            name: Advies-gereedheid (samenvatting)

  - title: Klimaat
    path: klimaat
    icon: mdi:home-thermometer-outline
    cards:
      - type: custom:mushroom-title-card
        title: Klimaat — woonkamertemperatuur-projectie
        subtitle: >-
          Puur informatief — stuurt nooit een commando. Rolluikstand en
          airco-status worden voor de hele projectie constant gehouden
          op de huidige stand (onbekend wat die over enkele uren zijn).
          Bewolking is bewust géén aparte leerdimensie (te veel cellen
          zouden maandenlang "onvoldoende data" blijven tonen) — de
          KNMI/OpenWeatherMap-buitentemperatuur-voorspelling wordt wel
          gebruikt om de projectie uur voor uur door te rekenen. De
          projectie verankert elke tick opnieuw aan de actueel gemeten
          temperatuur; alleen het ophalen van de buitentemperatuur-
          voorspelling zelf gebeurt om prestatieredenen maar eens per
          30 minuten.

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: >-
              {{ states('sensor.woonkamer_energy_management_system_klimaat_projectie_woonkamertemperatuur') }} °C
            secondary: Woonkamertemperatuur (live)
            icon: mdi:thermometer
            icon_color: blue
          - type: custom:mushroom-template-card
            primary: >-
              {{ state_attr('sensor.woonkamer_energy_management_system_klimaat_projectie_woonkamertemperatuur', 'buitentemperatuur_live_c') }} °C
            secondary: Buitentemperatuur (live, KNMI/OpenWeatherMap)
            icon: mdi:thermometer-lines
            icon_color: cyan
          - type: custom:mushroom-template-card
            primary: >-
              {{ state_attr('sensor.woonkamer_energy_management_system_klimaat_projectie_woonkamertemperatuur', 'rolluikstand') or 'onbekend' }}
            secondary: Rolluikstand (beide entiteiten samen)
            icon: mdi:blinds-horizontal
            icon_color: grey
          - type: custom:mushroom-template-card
            primary: >-
              {{ state_attr('sensor.woonkamer_energy_management_system_klimaat_projectie_woonkamertemperatuur', 'airco_status') or 'onbekend' }}
            secondary: Airco-status
            icon: mdi:air-conditioner
            icon_color: orange
          - type: custom:mushroom-template-card
            primary: >-
              {{ states('sensor.woonkamer_energy_management_system_airco_verwachting_woonkamertemperatuur') }} °C
            secondary: >-
              Airco-verwachting — kans binnen 1 uur: {{
              state_attr('sensor.woonkamer_energy_management_system_airco_verwachting_woonkamertemperatuur', 'kans_airco_binnen_1_uur_procent')
              }}%
            icon: mdi:thermometer-lines
            icon_color: purple

      - type: markdown
        content: |
          **Betrouwbaarheid-legenda:** 🟡 `indicatief` (≥5 metingen
          voor deze combinatie van buitentemperatuur/rolluikstand/
          airco-status — al bruikbaar, maar nog weinig data) · ✅
          `betrouwbaar` (≥15 metingen) · ⚪ `onvoldoende_data`
          (temperatuur blijft ongewijzigd t.o.v. het vorige uur, in
          plaats van te gokken).

      - type: markdown
        title: Korte termijn (indicatief)
        content: |
          {% set traject = state_attr('sensor.woonkamer_energy_management_system_klimaat_projectie_woonkamertemperatuur', 'traject') or [] %}
          {% if traject | length == 0 %}
          Nog geen projectie beschikbaar - {{ state_attr('sensor.woonkamer_energy_management_system_klimaat_projectie_woonkamertemperatuur', 'note') or 'onbekende reden' }}.
          {% else %}
          | Uur | Buiten (°C) | Woonkamer (°C) | Betrouwbaarheid |
          |---|---|---|---|
          {% for rij in traject -%}
          {%- set icoon = {'betrouwbaar': '✅', 'indicatief': '🟡', 'onvoldoende_data': '⚪'}.get(rij.betrouwbaarheid, '?') -%}
          | {{ rij.tijd[11:16] }} | {{ rij.buitentemp_voorspeld_c }} | {{ rij.kort_termijn_temp_c }} | {{ icoon }} {{ rij.betrouwbaarheid }} |
          {% endfor %}
          {% endif %}
        grid_options:
          columns: 12
          rows: auto

      - type: markdown
        title: Betrouwbaar (≥15 metingen per cel)
        content: |
          {% set traject = state_attr('sensor.woonkamer_energy_management_system_klimaat_projectie_woonkamertemperatuur', 'traject') or [] %}
          {% if traject | length == 0 %}
          Nog geen projectie beschikbaar.
          {% else %}
          | Uur | Buiten (°C) | Woonkamer (°C) | Betrouwbaarheid |
          |---|---|---|---|
          {% for rij in traject -%}
          {%- set icoon = {'betrouwbaar': '✅', 'indicatief': '🟡', 'onvoldoende_data': '⚪'}.get(rij.betrouwbaarheid, '?') -%}
          | {{ rij.tijd[11:16] }} | {{ rij.buitentemp_voorspeld_c }} | {{ rij.betrouwbaar_temp_c }} | {{ icoon }} {{ rij.betrouwbaarheid }} |
          {% endfor %}
          {% endif %}
        grid_options:
          columns: 12
          rows: auto

  - title: Geschiedenis
    path: geschiedenis
    icon: mdi:history
    cards:
      - type: custom:mushroom-title-card
        title: Geschiedenis

      - type: markdown
        title: Overgangen energie-check (logboek, laatste 10)
        content: >
          | Tijdstip | Beslissing | Beschikbaar | Benodigd | Doel-goedkoop-blok |

          |---|---|---|---|---|

          {%- for entry in
          (state_attr('sensor.energy_management_system_energy_bridge_check',
          'transition_log') or []) | reverse | list %}

          {%- if loop.index0 < 10 %}

          | {{ as_timestamp(entry.get('at')) | timestamp_custom('%a %H:%M') if
          entry.get('at') else 'onbekend' }} | {{ entry.get('decision', 'onbekend') }}
          | {{ entry.get('available_kwh', 'onbekend') }} kWh | {{
          entry.get('needed_kwh', 'onbekend') }} kWh | {{
          (as_timestamp(entry.get('cheap_block_start')) |
          timestamp_custom('%a %H:%M')) if entry.get('cheap_block_start') else
          'onbekend' }} |

          {%- endif %}

          {%- endfor %}
      - type: markdown
        title: Overzicht komende uren (verwacht schema)
        content: >
          | Van | Tot | Modus | Prijsrange |

          |---|---|---|---|

          {%- for block in
          state_attr('sensor.energy_management_system_upcoming_schedule',
          'transitions') | default([]) %}

          | {{ as_timestamp(block.get('start')) | timestamp_custom('%a %H:%M') if
          block.get('start') else 'onbekend' }} | {{
          as_timestamp(block.get('end')) | timestamp_custom('%a %H:%M') if
          block.get('end') else 'onbekend' }} | {{ block.get('mode', 'onbekend')
          }} | {{ '%.4f'|format(block.get('min_price_per_kwh', 0)) }} - {{
          '%.4f'|format(block.get('max_price_per_kwh', 0)) }} €/kWh |

          {%- endfor %}
      - type: history-graph
        title: Verwachte vs. werkelijke modus over tijd
        hours_to_show: 48
        entities:
          - entity: sensor.energy_management_system_expected_operation_mode
            name: Verwacht
          - entity: select.zendure_manager_operation
            name: Werkelijk
      - type: history-graph
        title: SoC & verbruik over tijd
        hours_to_show: 48
        entities:
          - entity: sensor.solarflow_2400_ac_electric_level
            name: SoC (%)
          - entity: sensor.solarflow_2400_ac_available_kwh
            name: Beschikbare kWh
          - entity: sensor.hw_p1_vermogen
            name: Verbruik (W)
      - type: history-graph
        title: Verbruiksprofiel (hele dag) & voorspelling-afwijking over tijd
        hours_to_show: 168
        entities:
          - entity: >-
              sensor.woonkamer_energy_management_system_hourly_consumption_profile
            name: Verbruiksprofiel (huidig uur, W)
          - entity: sensor.energy_management_system_pv_forecast_accuracy
            name: PV-voorspelling afwijking (%)

  - title: Water
