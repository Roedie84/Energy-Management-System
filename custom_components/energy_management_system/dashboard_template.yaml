    - type: custom:mushroom-template-card
      primary: Zelflerend
      secondary: '{% set s = (state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''samenvattingen'') or {}).get(''zelflerend'') or {} %}{{ s.get(''zin'', ''Nog geen gegevens.'') }}'
      multiline_secondary: true
      icon: mdi:school-outline
      icon_color: '{% set n = ((state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''samenvattingen'') or {}).get(''zelflerend'') or {}).get(''niveau'') %}{{ ''red'' if n == ''onbetrouwbaar'' else (''green'' if n == ''betrouwbaar'' else ''orange'') }}'
      entity: sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling
      tap_action:
