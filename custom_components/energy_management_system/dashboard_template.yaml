        | Gemeten piek | {{ e.gemeten_piekvermogen_w }} W |

        | Ontlaadvermogen | {{ e.ontlaadvermogen_w }} W |

        | Benutting | {{ e.vermogensbenutting_procent }}% |

        | Dagverbruik | {{ e.dagverbruik_kwh }} kWh |

        | Bruikbare capaciteit | {{ e.bruikbare_capaciteit_kwh }} kWh |

        | Tekort-nachten | {{ e.tekort_nachten }} |

        | Modules nu / mogelijk | {{ e.modules_nu }} van {{ e.modules_mogelijk_op_deze_omvormer }} |

        | Laadvermogen | {{ e.laadvermogen_w }} van {{ e.laadvermogen_max_w | round(0) }} W{% if e.vermogen_bewust_begrensd %} (bewust){% endif %} |

        | Opbrengst accu per jaar | {{ e.opbrengst_accu_per_jaar_eur }} EUR |

        | Opbrengst extra module | {{ e.opbrengst_extra_module_per_jaar_eur }} EUR/jaar |

        | Terugverdientijd module | {{ e.terugverdientijd_module_jaar }} jaar |

        | Terugverdientijd omvormer | {{ e.terugverdientijd_omvormer_jaar }} jaar |


        **{{ e.advies }}**


        _{{ e.voorbehoud }}_{% endif %}


