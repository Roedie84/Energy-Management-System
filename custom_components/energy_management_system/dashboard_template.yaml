            secondary: Geschatte resterende capaciteit
            icon: mdi:battery-alert-variant-outline
            icon_color: deep-purple

      - type: markdown
        content: >-
          ⚠️ {{
          state_attr('sensor.woonkamer_energy_management_system_accu_gezondheid_geschat',
          'note') }}

      - type: custom:mushroom-template-card
        primary: >-
          {{ states('sensor.woonkamer_energy_management_system_co2_uitstoot_vandaag') }} kg CO2
        secondary: >-
          Uitstoot vandaag (huidige intensiteit: {{
          state_attr('sensor.woonkamer_energy_management_system_co2_uitstoot_vandaag', 'huidige_intensiteit_g_per_kwh')
          or 'onbekend' }} g/kWh)
        icon: mdi:molecule-co2
        icon_color: grey
