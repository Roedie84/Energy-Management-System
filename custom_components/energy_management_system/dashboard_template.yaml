      secondary: '{% set s = (state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''samenvattingen'') or {}).get(''financieel'') or {} %}{{ s.get(''zin'', ''Nog geen gegevens.'') }}'
      multiline_secondary: true
      icon: mdi:cash-multiple
      icon_color: '{% set n = ((state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''samenvattingen'') or {}).get(''financieel'') or {}).get(''niveau'') %}{{ ''red'' if n == ''onbetrouwbaar'' else (''green'' if n == ''betrouwbaar'' else ''orange'') }}'
      entity: sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling
      tap_action:
        action: navigate
        navigation_path: /energy-management-system/detail-kosten
      grid_options:
        columns: 12
        rows: auto
    - type: custom:mushroom-template-card
      primary: Klimaat
      secondary: '{% set s = (state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''samenvattingen'') or {}).get(''klimaat'') or {} %}{{ s.get(''zin'', ''Nog geen gegevens.'') }}'
      multiline_secondary: true
      icon: mdi:home-thermometer
      icon_color: '{% set n = ((state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''samenvattingen'') or {}).get(''klimaat'') or {}).get(''niveau'') %}{{ ''red'' if n == ''onbetrouwbaar'' else (''green'' if n == ''betrouwbaar'' else ''orange'') }}'
      entity: sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling
      tap_action:
        action: navigate
        navigation_path: /energy-management-system/detail-klimaat
      grid_options:
        columns: 12
