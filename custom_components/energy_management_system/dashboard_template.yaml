      secondary: Accubescherming
      icon: mdi:battery-lock
      entity: sensor.energy_management_system_battery_protection
      tap_action:
        action: more-info
    - type: markdown
      title: Komend schema
      content: '{% set t = state_attr(''sensor.energy_management_system_upcoming_schedule'', ''transitions'') or [] %}{% if t | length == 0 %}Nog geen schema berekend.{% else %}| Van | Tot | Modus | Prijs (ct/kWh) |

        |---|---|---|---|

        {% for b in t %}| {{ as_timestamp(b.get(''start'')) | timestamp_custom(''%H:%M'') if b.get(''start'') else ''?'' }} | {{ as_timestamp(b.get(''end'')) | timestamp_custom(''%H:%M'') if b.get(''end'') else ''?'' }} | {{ b.get(''mode'') }} | {% set lo = b.get(''min_price_per_kwh'') %}{% set hi = b.get(''max_price_per_kwh'') %}{% if lo is none or hi is none %}—{% elif (hi - lo) < 0.0005 %}{{ ''%.1f''|format(lo * 100) }}{% else %}{{ ''%.1f''|format(lo * 100) }} – {{ ''%.1f''|format(hi * 100) }}{% endif %} ct |

        {% endfor %}{% endif %}


        _Kwartieren met dezelfde modus staan als een blok. De prijs wisselt binnen zo''n blok per kwartier; hier staat het bereik van laag tot hoog._'
    - type: markdown
      title: Zon opvangen uitstellen?
      content: '{% set p = state_attr(''sensor.woonkamer_energy_management_system_gacs_zelfbeoordeling'', ''zon_uitstelplan'') or {} %}{% if p.get(''uitstellen'') %}**Ja, tot {{ p.omslag_uur }}:00.**


        | | |

        |---|---|

        | Nog te vullen | {{ p.ruimte_kwh }} kWh |

        | Prijsverschil | {{ p.prijsverschil_ct }} ct |

        | Geschatte winst | {{ p.geschatte_winst_eur }} EUR |

        | Vol uiterlijk | {{ p.vol_uiterlijk }} |


        {{ p.reden }}{% else %}**Nee.** {{ p.get(''reden'', ''Nog geen plan berekend.'') }}{% endif %}


        _De accu neemt een vast aantal kilowattuur op; wélke dat zijn bepaalt wat je exporteert. Vroeg laden slurpt de dure ochtendzon op en laat de goedkope middagzon over voor het net - laat laden doet het omgekeerd. Zelfde eind-SoC, hogere opbrengst._


        **Verder:** [Kwartierplanning](/energy-management-system/detail-kwartier) · [Samenvatting](/energy-management-system/detail-planning-samenvatting) · [Plantoetsing](/energy-management-system/detail-plantoetsing)'
      grid_options:
        columns: 12
        rows: auto
