title: Energy Management System
views:
  - title: Overzicht
    path: overzicht
    icon: mdi:home-lightning-bolt
    type: sections
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Energy Management System
            subtitle: >-
              {{ state_attr('sensor.energy_management_system_last_decision_reason',
              'friendly_name') }}: {{
              states('sensor.energy_management_system_last_decision_reason') }}
            grid_options:
              columns: 12
              rows: 1
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.woonkamer_energy_management_system_system_status') }}"
            secondary: >-
              {% set t =
              state_attr('sensor.woonkamer_energy_management_system_system_status',
              'last_successful_update') %}
              {{ as_timestamp(t) | timestamp_custom('%a %H:%M:%S') if t else 'nog geen succesvolle update' }}
            icon: >-
              {{ 'mdi:check-circle-outline' if
              states('sensor.woonkamer_energy_management_system_system_status') == 'OK' else
              'mdi:alert-circle-outline' }}
            icon_color: >-
              {{ 'green' if states('sensor.woonkamer_energy_management_system_system_status')
              == 'OK' else 'red' }}
            entity: sensor.woonkamer_energy_management_system_system_status
            tap_action:
              action: more-info
            grid_options:
              columns: 12
              rows: 1
          - type: markdown
            content: |
              {% set updated = state_attr('sensor.woonkamer_energy_management_system_explanation', 'last_successful_update') %}{% set fm = state_attr('sensor.woonkamer_energy_management_system_explanation', 'force_manual') %}{% set mode = state_attr('sensor.woonkamer_energy_management_system_explanation', 'expected_mode') %}{% set price = state_attr('sensor.woonkamer_energy_management_system_explanation', 'current_price_per_kwh') %}{% set threshold = state_attr('sensor.woonkamer_energy_management_system_explanation', 'expensive_price_threshold') %}{% set count = state_attr('sensor.woonkamer_energy_management_system_explanation', 'effective_expensive_quarters_count') %}| — | — |
              |---|---|
              | 🕐 **Tijd:** {{ as_timestamp(updated) | timestamp_custom('%d-%m %H:%M') if updated else 'onbekend' }} | 🔒 **Force manual:** {{ 'aan' if fm else 'uit' }} |
              | ⚙️ **Modus:** {{ mode if mode else 'onbekend' }} | 💰 **Prijs:** {{ '€%.3f/kWh' | format(price) if price is not none else 'onbekend' }} |
              | 📈 **Drempel duur:** {{ '€%.3f/kWh' | format(threshold) if threshold is not none else 'n.v.t.' }} | 🎯 **Dure kwartieren:** {{ count if count is not none else 0 }} |

              {{ state_attr('sensor.woonkamer_energy_management_system_explanation', 'explanation') }}
            grid_options:
              columns: 12
              rows: auto

      - type: grid
        cards:
          - type: heading
            heading: Accu & rendement
            grid_options:
              columns: 12
              rows: 1
          - type: gauge
            entity: sensor.solarflow_2400_ac_electric_level
            name: Accu SoC
            min: 0
            max: 100
            severity:
              green: 40
              yellow: 20
              red: 0
            grid_options:
              columns: 6
              rows: 2
          - type: gauge
            entity: >-
              sensor.woonkamer_energy_management_system_learned_battery_efficiency
            name: Geleerd rendement
            min: 50
            max: 100
            severity:
              green: 75
              yellow: 60
              red: 0
            grid_options:
              columns: 6
              rows: 2
          - type: markdown
            content: >
              {%- set history =
              state_attr('sensor.woonkamer_energy_management_system_learned_battery_efficiency',
              'history') or [] %}

              {%- if history|length >= 2 %}

              {%- set previous = history[-2] %}

              {%- set current = history[-1] %}

              {%- set diff = current - previous %}

              Rendement {{ '↑' if diff > 0 else ('↓' if diff < 0 else '→') }} vorige
              meting was {{ previous }}% ({{ '%+.1f'|format(diff) }}%)

              {%- else %}

              Nog niet genoeg metingen voor een trend

              {%- endif %}
            grid_options:
              columns: 12
              rows: 2

      - type: grid
        cards:
          - type: heading
            heading: Live cijfers
            grid_options:
              columns: 12
              rows: 1
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.solarflow_2400_ac_available_kwh') }} kWh"
            secondary: Beschikbare energie
            icon: mdi:battery-high
            icon_color: green
            entity: sensor.solarflow_2400_ac_available_kwh
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.hw_p1_vermogen') }} W"
            secondary: Huidig verbruik
            icon: mdi:home-lightning-bolt-outline
            icon_color: orange
            entity: sensor.hw_p1_vermogen
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-template-card
            primary: >-
              {{
              states('sensor.woonkamer_energy_management_system_current_price_used_by_integration')
              }} €/kWh
            secondary: Huidige prijs
            icon: mdi:cash-sync
            icon_color: blue
            entity: >-
              sensor.woonkamer_energy_management_system_current_price_used_by_integration
            grid_options:
              columns: 6
              rows: 1

      - type: grid
        cards:
          - type: heading
            heading: Modus & besluit
            grid_options:
              columns: 12
              rows: 1
          - type: custom:mushroom-template-card
            primary: "{{ states('select.zendure_manager_operation') }}"
            secondary: Werkelijke modus (Zendure — alleen weergave)
            icon: mdi:battery-sync
            icon_color: cyan
            entity: select.zendure_manager_operation
            tap_action:
              action: none
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-template-card
            primary: >-
              {{
              states('sensor.energy_management_system_expected_operation_mode')
              }}
            secondary: Verwachte modus (logica)
            icon: mdi:brain
            icon_color: purple
            entity: sensor.energy_management_system_expected_operation_mode
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-template-card
            primary: >-
              {{
              states('sensor.energy_management_system_effective_expensive_quarters')
              }} kwartieren
            secondary: Boven prijsdrempel (hele dag, incl. voorbije uren)
            icon: mdi:chart-bell-curve
            icon_color: red
            entity: sensor.energy_management_system_effective_expensive_quarters
            grid_options:
              columns: 6
              rows: 1
          - type: markdown
            content: >
              ℹ️ Dit telt de **hele kalenderdag** (ook uren die al voorbij
              zijn) — dat kan dus hoger uitvallen dan het aantal
              "manual"-kwartieren dat je nog in het schema (Geschiedenis-
              tabblad) ziet, wat alleen de **resterende** tijd toont.
            grid_options:
              columns: 12
              rows: 2
          - type: custom:mushroom-template-card
            primary: "{{ states('number.solaredge_i1_active_power_limit') }}%"
            secondary: Zonnepaneel-vermogenslimiet (bij negatieve prijs)
            icon: mdi:solar-power-variant
            icon_color: amber
            entity: number.solaredge_i1_active_power_limit
            tap_action:
              action: none
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 1
          - type: custom:mushroom-template-card
            primary: >-
              {% set source = state_attr('sensor.woonkamer_energy_management_system_explanation', 'heavy_load_source') %}
              {{ {'vaatwasser': 'Vaatwasser', 'wasmachine': 'Wasmachine', 'quooker': 'Quooker', 'airco': 'Airco', 'oven': 'Oven', 'kookplaat': 'Kookplaat'}.get(source, 'Geen') }}
            secondary: Grootverbruiker bevestigd actief (omzeilt mediaan-vertraging)
            icon: >-
              {{ 'mdi:lightning-bolt' if
              state_attr('sensor.woonkamer_energy_management_system_explanation', 'heavy_load_source')
              else 'mdi:lightning-bolt-outline' }}
            icon_color: >-
              {{ 'orange' if
              state_attr('sensor.woonkamer_energy_management_system_explanation', 'heavy_load_source')
              else 'grey' }}
            entity: sensor.woonkamer_energy_management_system_explanation
            tap_action:
              action: none
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 1

      - type: grid
        cards:
          - type: heading
            heading: Besturing
            grid_options:
              columns: 12
              rows: 1
          - type: custom:mushroom-entity-card
            entity: switch.energy_management_system_force_manual
            name: Force manual
            icon: mdi:hand-back-right
            grid_options:
              columns: 4
              rows: 1
          - type: custom:mushroom-entity-card
            entity: switch.energy_management_system_learning_only_no_control
            name: Learning only
            icon: mdi:school-outline
            grid_options:
              columns: 4
              rows: 1
          - type: custom:mushroom-entity-card
            entity: switch.woonkamer_energy_management_system_vacation_mode
            name: Vakantiemodus
            icon: mdi:bag-suitcase-outline
            grid_options:
              columns: 4
              rows: 1
          - type: custom:mushroom-entity-card
            entity: button.woonkamer_energy_management_system_test_notificatie_versturen
            name: Test notificatie
            icon: mdi:bell-ring-outline
            grid_options:
              columns: 4
              rows: 1
          - type: custom:mushroom-entity-card
            entity: switch.woonkamer_energy_management_system_steelstofzuiger_overrule
            name: Steelstofzuiger overrule
            icon: mdi:hand-back-right-outline
            grid_options:
              columns: 4
              rows: 1
          - type: custom:mushroom-entity-card
            entity: switch.woonkamer_energy_management_system_fietsladers_overrule
            name: Fietsladers overrule
            icon: mdi:hand-back-right-outline
            grid_options:
              columns: 4
              rows: 1

      - type: grid
        cards:
          - type: heading
            heading: Actuele beslissing (detail)
            grid_options:
              columns: 12
              rows: 1
          - type: entities
            entities:
              - entity: sensor.energy_management_system_last_decision_reason
                name: Reden laatste beslissing
              - entity: sensor.energy_management_system_simulated_action
                name: Gesimuleerde actie (bij learning only)
              - entity: sensor.energy_management_system_cheapest_block_start
                name: Start goedkoopste blok
              - entity: sensor.energy_management_system_discharge_window_start
                name: Start ontlaadvenster
              - entity: sensor.energy_management_system_energy_bridge_check
                name: Energie-check (genoeg om te overbruggen?)
              - entity: sensor.energy_management_system_battery_protection
                name: Accu-bescherming (toegepast ontlaadvermogen)
              - entity: sensor.woonkamer_energy_management_system_steelstofzuiger_status
                name: Steelstofzuiger status

  - title: Financieel
    path: financieel
    icon: mdi:cash-multiple
    cards:
      - type: custom:mushroom-title-card
        title: Financieel

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: >-
              € {{
              states('sensor.woonkamer_energy_management_system_discharge_value_expensive_quarters')
              }}
            secondary: Waarde ontladen (totaal)
            icon: mdi:cash-plus
            icon_color: green
            entity: >-
              sensor.woonkamer_energy_management_system_discharge_value_expensive_quarters
          - type: custom:mushroom-template-card
            primary: >-
              € {{
              states('sensor.woonkamer_energy_management_system_charge_cost_grid_charging')
              }}
            secondary: Netlaadkosten (totaal)
            icon: mdi:cash-minus
            icon_color: red
            entity: >-
              sensor.woonkamer_energy_management_system_charge_cost_grid_charging

      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: "€ {{ states('sensor.ems_ontlaadwaarde_vandaag') }}"
            secondary: Vandaag
            icon: mdi:calendar-today
            icon_color: green
            entity: sensor.ems_ontlaadwaarde_vandaag
          - type: custom:mushroom-template-card
            primary: "€ {{ states('sensor.ems_ontlaadwaarde_deze_week') }}"
            secondary: Deze week
            icon: mdi:calendar-week
            icon_color: green
            entity: sensor.ems_ontlaadwaarde_deze_week
          - type: custom:mushroom-template-card
            primary: "€ {{ states('sensor.ems_ontlaadwaarde_deze_maand') }}"
            secondary: Deze maand
            icon: mdi:calendar-month
            icon_color: green
            entity: sensor.ems_ontlaadwaarde_deze_maand
          - type: custom:mushroom-template-card
            primary: "€ {{ states('sensor.ems_netlaadkosten_vandaag') }}"
            secondary: Vandaag
            icon: mdi:calendar-today
            icon_color: red
            entity: sensor.ems_netlaadkosten_vandaag
          - type: custom:mushroom-template-card
            primary: "€ {{ states('sensor.ems_netlaadkosten_deze_week') }}"
            secondary: Deze week
            icon: mdi:calendar-week
            icon_color: red
            entity: sensor.ems_netlaadkosten_deze_week
          - type: custom:mushroom-template-card
            primary: "€ {{ states('sensor.ems_netlaadkosten_deze_maand') }}"
            secondary: Deze maand
            icon: mdi:calendar-month
            icon_color: red
            entity: sensor.ems_netlaadkosten_deze_maand

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: >-
              {{
              states('sensor.woonkamer_energy_management_system_reserve_shortfall_days')
              }}
            secondary: Onverwachte netimport-dagen (laatste 7)
            icon: mdi:alert-outline
            icon_color: >-
              {{ 'red' if
              states('sensor.woonkamer_energy_management_system_reserve_shortfall_days')
              | int(0) > 0 else 'grey' }}
            entity: >-
              sensor.woonkamer_energy_management_system_reserve_shortfall_days
          - type: custom:mushroom-template-card
            primary: >-
              {{
              states('sensor.woonkamer_energy_management_system_reserve_excess_days')
              }}
            secondary: Overschot-dagen (laatste 7)
            icon: mdi:trending-up
            icon_color: >-
              {{ 'amber' if
              states('sensor.woonkamer_energy_management_system_reserve_excess_days')
              | int(0) > 0 else 'grey' }}
            entity: >-
              sensor.woonkamer_energy_management_system_reserve_excess_days

      - type: markdown
        title: Maandoverzicht (t.o.v. vorige maand)
        content: >
          {%- set cur_discharge =
          state_attr('sensor.woonkamer_energy_management_system_monthly_summary',
          'current_month_discharge_value_eur') or 0 %}

          {%- set cur_cost =
          state_attr('sensor.woonkamer_energy_management_system_monthly_summary',
          'current_month_charge_cost_eur') or 0 %}

          {%- set cur_net = cur_discharge - cur_cost %}

          {%- set prev_net =
          state_attr('sensor.woonkamer_energy_management_system_monthly_summary',
          'previous_month_net_eur') %}

          **Deze maand tot nu toe:** € {{ '%.2f'|format(cur_net) }} netto ({{
          '%.2f'|format(cur_discharge) }} ontladen − {{ '%.2f'|format(cur_cost)
          }} netladen)


          {%- if prev_net is not none %}

          **Vorige maand:** € {{ '%.2f'|format(prev_net) }} netto

          {%- set diff = cur_net - prev_net %}

          {{ '↑' if diff > 0 else ('↓' if diff < 0 else '→') }} {{
          '%+.2f'|format(diff) }} ten opzichte van dezelfde periode vorige
          maand

          {%- else %}

          Nog geen vorige maand om mee te vergelijken — dat verschijnt na de
          eerste maandwisseling.

          {%- endif %}

  - title: Zelflerend
    path: zelflerend
    icon: mdi:school-outline
    cards:
      - type: custom:mushroom-title-card
        title: Zelflerend

      - type: grid
        columns: 2
        square: false
        cards:
          - type: gauge
            entity: >-
              sensor.woonkamer_energy_management_system_learned_battery_efficiency
            name: Geleerd accu-rendement
            min: 50
            max: 100
            severity:
              green: 75
              yellow: 60
              red: 0
          - type: custom:mushroom-template-card
            primary: >-
              {{ states('sensor.energy_management_system_pv_forecast_accuracy')
              }}{{ '%' if
              states('sensor.energy_management_system_pv_forecast_accuracy') not
              in ['unknown', 'unavailable'] else '' }}
            secondary: PV-voorspelling afwijking
            icon: mdi:solar-power-variant
            icon_color: >-
              {{ 'amber' if
              states('sensor.energy_management_system_pv_forecast_accuracy') not
              in ['unknown', 'unavailable'] else 'grey' }}
            entity: sensor.energy_management_system_pv_forecast_accuracy

      - type: markdown
        content: >
          {%- set eff_history =
          state_attr('sensor.woonkamer_energy_management_system_learned_battery_efficiency',
          'history') or [] %}

          {%- if eff_history|length >= 2 %}

          {%- set previous = eff_history[-2] %}

          {%- set current = eff_history[-1] %}

          {%- set diff = current - previous %}

          **Rendement:** {{ '↑' if diff > 0 else ('↓' if diff < 0 else '→') }}
          vorige meting was {{ previous }}% ({{ '%+.1f'|format(diff) }}
          %)

          {%- else %}

          **Rendement:** nog niet genoeg metingen voor een trend

          {%- endif %}


          {%- set dev_history =
          state_attr('sensor.energy_management_system_pv_forecast_accuracy',
          'deviation_history') or [] %}

          {%- if dev_history|length >= 2 %}

          {%- set previous = dev_history[-2] %}

          {%- set current = dev_history[-1] %}

          {%- set diff = current - previous %}

          **PV-afwijking:** {{ '↑' if diff > 0 else ('↓' if diff < 0 else '→') }}
          vorige dag was {{ previous }}% ({{ '%+.1f'|format(diff) }} %)

          {%- else %}

          **PV-afwijking:** nog niet genoeg dagen voor een trend

          {%- endif %}

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: >-
              {{
              states('sensor.woonkamer_energy_management_system_hourly_consumption_profile')
              }} W
            secondary: Verbruiksprofiel (huidig uur)
            icon: mdi:chart-line
            icon_color: blue
            entity: >-
              sensor.woonkamer_energy_management_system_hourly_consumption_profile
          - type: custom:mushroom-template-card
            primary: >-
              {{ states('sensor.energy_management_system_learned_night_consumption') }} W
            secondary: Nachtvenster-gemiddelde (legacy fallback)
            icon: mdi:weather-night
            icon_color: indigo
            entity: sensor.energy_management_system_learned_night_consumption
          - type: custom:mushroom-template-card
            primary: >-
              {{
              states('sensor.woonkamer_energy_management_system_pv_hourly_forecast_bias')
              }}
            secondary: PV-voorspelling bias (huidig uur)
            icon: mdi:weather-partly-cloudy
            icon_color: amber
            entity: >-
              sensor.woonkamer_energy_management_system_pv_hourly_forecast_bias

      - type: markdown
        title: Verbruiksprofiel per uur (W)
        content: >
          | Uur | Verbruik | Verschil |

          |---|---|---|

          {%- set profile =
          state_attr('sensor.woonkamer_energy_management_system_hourly_consumption_profile',
          'profile_watts') or {} %}

          {%- set previous =
          state_attr('sensor.woonkamer_energy_management_system_hourly_consumption_profile',
          'previous_profile_watts') or {} %}

          {%- for hour in range(24) %}

          {%- set current_val = profile.get(hour|string) %}

          {%- if current_val is not none %}

          | {{ '%02d:00' | format(hour) }} | {{ current_val }} W | {%- set
          prev_val = previous.get(hour|string) %}{%- if prev_val is not none
          %} {% set diff = current_val - prev_val %}{{ '↑' if diff > 0 else
          ('↓' if diff < 0 else '→') }} {{ '%+d'|format(diff) }} W{%- else %}
          — {%- endif %} |

          {%- endif %}

          {%- endfor %}

      - type: markdown
        title: Nachtvenster-gemiddelde (laatste 7 nachten, W)
        content: >
          Legacy fallback — alleen gebruikt als het uur-profiel hierboven geen
          data heeft voor het huidige uur.


          | Nacht | Gemiddelde | Verschil |

          |---|---|---|

          {%- set history_kw =
          state_attr('sensor.energy_management_system_learned_night_consumption',
          'history_kw') or [] %}

          {%- for v in history_kw %}

          | {{ loop.index }}{{ ' (meest recent)' if loop.last else '' }} | {{
          (v * 1000) | round(0) | int }} W | {%- if not loop.first %} {% set
          diff = (v - history_kw[loop.index0 - 1]) * 1000 %}{{ '↑' if diff > 0
          else ('↓' if diff < 0 else '→') }} {{ '%+.0f'|format(diff) }} W{%-
          else %} — {%- endif %} |

          {%- endfor %}

      - type: markdown
        title: Solcast-voorspelling — nauwkeurigheid per dag
        content: >
          | Dag | Afwijking | Verschil |

          |---|---|---|

          {%- set deviations =
          state_attr('sensor.energy_management_system_pv_forecast_accuracy',
          'deviation_history') or [] %}

          {%- for v in deviations %}

          | {{ loop.index }}{{ ' (meest recent)' if loop.last else '' }} | {{ v }}%
          | {%- if not loop.first %} {% set diff = v -
          deviations[loop.index0 - 1] %}{{ '↑' if diff > 0 else ('↓' if diff <
          0 else '→') }} {{ '%+.1f'|format(diff) }}%{%- else %} — {%- endif %} |

          {%- endfor %}

          | **Geleerde bias (gemiddeld)** | **{{
          state_attr('sensor.energy_management_system_pv_forecast_accuracy',
          'learned_bias_percent') }}%** | |

      - type: markdown
        title: PV-voorspelling bias per uur (werkelijk / voorspeld)
        content: >
          Een ratio van 1,0 betekent dat de voorspelling voor dat uur precies
          klopte; lager dan 1,0 betekent minder zon dan voorspeld.


          | Uur | Ratio | Verschil |

          |---|---|---|

          {%- set bias =
          state_attr('sensor.woonkamer_energy_management_system_pv_hourly_forecast_bias',
          'profile') or {} %}

          {%- set previous_bias =
          state_attr('sensor.woonkamer_energy_management_system_pv_hourly_forecast_bias',
          'previous_profile') or {} %}

          {%- for hour in range(24) %}

          {%- set current_val = bias.get(hour|string) %}

          {%- if current_val is not none %}

          | {{ '%02d:00' | format(hour) }} | {{ current_val }} | {%- set
          prev_val = previous_bias.get(hour|string) %}{%- if prev_val is not
          none %} {% set diff = current_val - prev_val %}{{ '↑' if diff > 0
          else ('↓' if diff < 0 else '→') }} {{ '%+.3f'|format(diff) }}{%- else
          %} — {%- endif %} |

          {%- endif %}

          {%- endfor %}

  - title: Apparaten
    path: apparaten
    icon: mdi:devices
    cards:
      - type: custom:mushroom-title-card
        title: Apparaten
        subtitle: >-
          Vaatwasser/wasmachine: informatief (geen aansturing).
          Steelstofzuiger/fietsladers: automatisch aangestuurd tijdens
          het goedkoopste blok.

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: >-
              {{
              states('sensor.woonkamer_energy_management_system_dishwasher_typical_usage_hours')
              }} uur
            secondary: Vaatwasser — typische gebruiksuren
            icon: mdi:dishwasher
            icon_color: blue
            entity: >-
              sensor.woonkamer_energy_management_system_dishwasher_typical_usage_hours
          - type: custom:mushroom-template-card
            primary: >-
              {{
              states('sensor.woonkamer_energy_management_system_washing_machine_typical_usage_hours')
              }} uur
            secondary: Wasmachine — typische gebruiksuren
            icon: mdi:washing-machine
            icon_color: blue
            entity: >-
              sensor.woonkamer_energy_management_system_washing_machine_typical_usage_hours
          - type: custom:mushroom-template-card
            primary: >-
              {{ states('sensor.woonkamer_energy_management_system_steelstofzuiger_status') }}
            secondary: >-
              Steelstofzuiger — status ({{
              state_attr('sensor.woonkamer_energy_management_system_steelstofzuiger_status', 'learned_duration_minutes')
              | round(0) if state_attr('sensor.woonkamer_energy_management_system_steelstofzuiger_status', 'learned_duration_minutes')
              is not none else '?' }} min geleerde laadduur)
            icon: mdi:vacuum
            icon_color: green
            entity: >-
              sensor.woonkamer_energy_management_system_steelstofzuiger_status
          - type: custom:mushroom-template-card
            primary: >-
              {{ states('sensor.woonkamer_energy_management_system_fietsladers_status') }}
            secondary: >-
              Fietsladers — status ({{
              state_attr('sensor.woonkamer_energy_management_system_fietsladers_status', 'learned_duration_minutes')
              | round(0) if state_attr('sensor.woonkamer_energy_management_system_fietsladers_status', 'learned_duration_minutes')
              is not none else '?' }} min geleerde laadduur)
            icon: mdi:bike
            icon_color: green
            entity: >-
              sensor.woonkamer_energy_management_system_fietsladers_status

      - type: entities
        title: Laatste meldingen
        entities:
          - entity: >-
              sensor.woonkamer_energy_management_system_dishwasher_last_notification
            name: Vaatwasser
          - entity: >-
              sensor.woonkamer_energy_management_system_washing_machine_last_notification
            name: Wasmachine

  - title: Geschiedenis
    path: geschiedenis
    icon: mdi:history
    cards:
      - type: custom:mushroom-title-card
        title: Geschiedenis

      - type: markdown
        title: Overgangen energie-check (logboek, laatste 10)
        content: >
          | Tijdstip | Beslissing | Beschikbaar | Benodigd | Doel-goedkoop-blok |

          |---|---|---|---|---|

          {%- for entry in
          (state_attr('sensor.energy_management_system_energy_bridge_check',
          'transition_log') or []) | reverse | list %}

          {%- if loop.index0 < 10 %}

          | {{ as_timestamp(entry.get('at')) | timestamp_custom('%a %H:%M') if
          entry.get('at') else 'onbekend' }} | {{ entry.get('decision', 'onbekend') }}
          | {{ entry.get('available_kwh', 'onbekend') }} kWh | {{
          entry.get('needed_kwh', 'onbekend') }} kWh | {{
          (as_timestamp(entry.get('cheap_block_start')) |
          timestamp_custom('%a %H:%M')) if entry.get('cheap_block_start') else
          'onbekend' }} |

          {%- endif %}

          {%- endfor %}
      - type: markdown
        title: Overzicht komende uren (verwacht schema)
        content: >
          | Van | Tot | Modus | Prijsrange |

          |---|---|---|---|

          {%- for block in
          state_attr('sensor.energy_management_system_upcoming_schedule',
          'transitions') | default([]) %}

          | {{ as_timestamp(block.get('start')) | timestamp_custom('%a %H:%M') if
          block.get('start') else 'onbekend' }} | {{
          as_timestamp(block.get('end')) | timestamp_custom('%a %H:%M') if
          block.get('end') else 'onbekend' }} | {{ block.get('mode', 'onbekend')
          }} | {{ '%.4f'|format(block.get('min_price_per_kwh', 0)) }} - {{
          '%.4f'|format(block.get('max_price_per_kwh', 0)) }} €/kWh |

          {%- endfor %}
      - type: history-graph
        title: Verwachte vs. werkelijke modus over tijd
        hours_to_show: 48
        entities:
          - entity: sensor.energy_management_system_expected_operation_mode
            name: Verwacht
          - entity: select.zendure_manager_operation
            name: Werkelijk
      - type: history-graph
        title: SoC & verbruik over tijd
        hours_to_show: 48
        entities:
          - entity: sensor.solarflow_2400_ac_electric_level
            name: SoC (%)
          - entity: sensor.solarflow_2400_ac_available_kwh
            name: Beschikbare kWh
          - entity: sensor.hw_p1_vermogen
            name: Verbruik (W)
      - type: history-graph
        title: Verbruiksprofiel (hele dag) & voorspelling-afwijking over tijd
        hours_to_show: 168
        entities:
          - entity: >-
              sensor.woonkamer_energy_management_system_hourly_consumption_profile
            name: Verbruiksprofiel (huidig uur, W)
          - entity: sensor.energy_management_system_pv_forecast_accuracy
            name: PV-voorspelling afwijking (%)
