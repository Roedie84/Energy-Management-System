          {% if tabel | length == 0 %}
          Nog geen apparaten bevestigd.
          {% else %}
          {% for rij in tabel %}
          - **{{ rij.naam }}** — {{ (rij.huidig_vermogen_w | round(0) | string ~ ' W') if rij.huidig_vermogen_w is not none else '—' }} — {{ rij.trend }}
          {% endfor %}
          {% endif %}

      - type: markdown
        title: Onbevestigde NILM-kandidaten (voorbeeld, max 20 van totaal)
        content: |
          {% set kandidaten = state_attr('sensor.woonkamer_energy_management_system_nilm_onbevestigde_kandidaten', 'kandidaten') or {} %}
          {% set totaal = state_attr('sensor.woonkamer_energy_management_system_nilm_onbevestigde_kandidaten', 'totaal_aantal') or 0 %}
          {% if kandidaten | length == 0 %}
          Geen onbevestigde kandidaten.
          {% else %}
          Toont {{ kandidaten | length }} van {{ totaal }} totaal - de volledige lijst staat in de diagnostiek-export.
          {% for entity_id, info in kandidaten.items() %}
          - **{{ info.friendly_name or entity_id }}** — {{ (info.current_power_w | round(1) | string ~ ' W') if info.current_power_w is not none else '—' }}
          {% endfor %}
          {% endif %}

      - type: markdown
        title: Waarschijnlijke NILM-duplicaten
        content: |
          {% set paren = state_attr('sensor.woonkamer_energy_management_system_nilm_bevestigde_apparaten', 'waarschijnlijke_duplicaten') or [] %}
          {% if paren | length == 0 %}
          Geen waarschijnlijke duplicaten gevonden onder de bevestigde apparaten.
          {% else %}
          Deze paren delen een (bijna) identieke vermogensgeschiedenis - vermoedelijk hetzelfde fysieke signaal onder twee HA-entiteiten. Beoordeel ze hieronder: ✅ = het is inderdaad een duplicaat (sluit het genoemde apparaat permanent uit), ❌ = geen duplicaat (het paar verdwijnt en komt nooit meer terug).
          {% for paar in paren %}
          - **{{ paar.apparaat_1 }}** ↔ **{{ paar.apparaat_2 }}** ({{ paar.gedeelde_dagen }} gedeelde dagen)
          {% endfor %}
          {% endif %}

