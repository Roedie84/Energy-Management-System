confirm_nilm_device:
  name: Bevestig NILM-apparaat
  description: >-
    Bevestig dat een automatisch ontdekte vermogen-sensor daadwerkelijk
    een apparaat is dat je wilt volgen. Start vanaf dat moment de
    verbruik-drift-detectie (mogelijk defect) voor dit apparaat.
  fields:
    entity_id:
      name: Entiteit
      description: >-
        De entity_id van de ontdekte vermogen-sensor (zie
        sensor.woonkamer_energy_management_system_nilm_onbevestigde_kandidaten
        voor de lijst).
      required: true
      selector:
        entity:
          domain: sensor

reject_nilm_device:
  name: Negeer NILM-apparaat
  description: >-
    Negeer een automatisch ontdekte vermogen-sensor permanent - wordt
    nooit meer voorgesteld. Verwijdert 'm ook uit de bevestigde lijst
    als je van gedachten bent veranderd.
  fields:
    entity_id:
      name: Entiteit
      description: De entity_id van de te negeren vermogen-sensor.
      required: true
      selector:
        entity:
          domain: sensor

unconfirm_nilm_device:
  name: Verwijder bevestigd NILM-apparaat (opnieuw beoordelen)
  description: >-
    Verwijder een bevestigd apparaat inclusief zijn volledige geleerde
    geschiedenis (basislijn, drift-status, dagelijkse gemiddelden) -
    bijvoorbeeld omdat het apparaat zelf is vervangen of gerepareerd en
    de oude basislijn niet meer klopt. In tegenstelling tot negeren
    wordt het apparaat NIET permanent geblokkeerd: bij de eerstvolgende
    scan verschijnt het gewoon weer als nieuwe, onbevestigde kandidaat,
    zodat je 'm met een verse basislijn opnieuw kunt bevestigen.
  fields:
    entity_id:
      name: Entiteit
      description: De entity_id van het te verwijderen, bevestigde apparaat.
      required: true
      selector:
        entity:
          domain: sensor

dismiss_nilm_duplicate_pair:
  name: Duplicaatpaar afwijzen (geen duplicaat)
  description: >-
    Markeer twee bevestigde NILM-apparaten als "geen duplicaat van
    elkaar". Het paar verdwijnt uit de lijst met waarschijnlijke
    duplicaten en komt daar nooit meer terug. Beide apparaten blijven
    gewoon bevestigd en worden gewoon verder gevolgd - alleen de
    suggestie verdwijnt. De volgorde van de twee entiteiten maakt niet
    uit.
  fields:
    entity_id_1:
      name: Eerste entiteit
      description: De entity_id van het eerste apparaat van het paar.
      required: true
      selector:
        entity:
          domain: sensor
    entity_id_2:
      name: Tweede entiteit
      description: De entity_id van het tweede apparaat van het paar.
      required: true
      selector:
        entity:
          domain: sensor

confirm_nilm_duplicate_pair:
  name: Duplicaatpaar bevestigen (tweede apparaat uitsluiten)
  description: >-
    Bevestig dat twee apparaten hetzelfde fysieke signaal meten. De
    TWEEDE opgegeven entiteit wordt permanent uitgesloten van NILM
    (zoals "negeren" bij een los apparaat), zodat hetzelfde verbruik
    niet dubbel geteld blijft worden. Het eerste apparaat blijft
    ongewijzigd bevestigd. Let op welke van de twee je als tweede
    invult - dat is degene die verdwijnt.
  fields:
    entity_id_1:
      name: Apparaat dat blijft
      description: De entity_id van het apparaat dat bevestigd blijft.
      required: true
      selector:
        entity:
          domain: sensor
    entity_id_2:
      name: Apparaat dat wordt uitgesloten
      description: De entity_id van het apparaat dat permanent wordt uitgesloten.
      required: true
      selector:
        entity:
          domain: sensor
